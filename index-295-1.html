<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#141B27" />
<title>배당 인컴</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-32.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="배당인컴" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
:root{
  --page:#FFFFFF; --bg:#F4F3EF; --card:#FFFFFF; --navy:#141B27; --navy2:#1C2636; --ink:#1B222C; --ink2:#3A4453;
  --green:#17A45C; --green-t:#E7F5EC; --blue:#3B82F6; --blue-t:#E9F1FE; --purple:#7A6CF5;
  --gold:#B39A6A; --red:#E5484D; --red-t:#FCEBEB; --muted:#8B93A0; --line:#ECEAE4;
  --maxw:480px;
  --shadow:0 1px 2px rgba(20,27,39,.05), 0 6px 20px rgba(20,27,39,.09);
  --font:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  --nav-h:64px;
}
[data-theme="dark"]{
  --page:#0C1017; --bg:#0C1017; --card:#151C27; --navy:#0A0E15; --navy2:#141C28; --ink:#E7ECF2; --ink2:#B7C0CC;
  --green:#34C47C; --green-t:#12261C; --blue:#5A9BFF; --blue-t:#122238; --purple:#9A8DFF;
  --gold:#CBB27E; --red:#F0605F; --red-t:#2A1618; --muted:#7C8695; --line:#212B39;
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 8px 26px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{max-width:var(--maxw);margin:0 auto;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));min-height:100vh;position:relative;overflow-x:hidden}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}
.wrap{padding:0 16px;max-width:430px;margin:0 auto}

/* ---- dark header ---- */
.head{background:var(--navy);color:#fff;padding:44px 20px 26px;border-radius:0 0 22px 22px}
.topspace{height:calc(env(safe-area-inset-top) + 14px)}
.head .eyebrow{font-size:13px;font-weight:700;color:var(--gold);letter-spacing:.01em;margin-bottom:8px}
.head .title{font-size:29px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.head .title .v{font-size:12px;font-weight:600;color:#69748A;margin-left:7px;vertical-align:middle}
.head .right{position:absolute}

/* ---- highlight cards ---- */
.hcard{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--card);border-radius:18px;padding:17px 18px;box-shadow:var(--shadow);margin-top:12px;border:1px solid transparent}
.hcard.green{background:var(--green-t);border-color:transparent}
.hcard.blue{background:var(--blue-t)}
.hcard .lft{min-width:0}
.hcard .l1{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.hcard.green .l1{color:#0E7A43}
.hcard.blue .l1{color:#2563EB}
[data-theme="dark"] .hcard.green .l1{color:var(--green)} [data-theme="dark"] .hcard.blue .l1{color:var(--blue)}
.hcard .l2{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:4px}
.hcard .big{font-size:30px;font-weight:800;letter-spacing:-.03em;flex:none}
.hcard.green .big{color:#0E7A43} .hcard.blue .big{color:#2563EB}
[data-theme="dark"] .hcard.green .big{color:var(--green)} [data-theme="dark"] .hcard.blue .big{color:var(--blue)}
.hcard .big small{font-size:15px}

/* ---- dark summary card ---- */
.sumcard{background:var(--navy2);color:#EAF0F7;border-radius:20px;padding:20px;margin-top:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.sumcard .glow{position:absolute;top:-70px;right:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(23,164,92,.22),transparent 70%);pointer-events:none}
.sumcard .stitle{font-size:14px;color:#9AA6B6;font-weight:700;margin-bottom:14px}
.sumcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.sumcol .sk{font-size:12.5px;color:#9AA6B6;font-weight:600;display:flex;align-items:center;gap:6px}
.sumcol .sv{font-size:26px;font-weight:800;color:#fff;letter-spacing:-.02em;margin-top:6px}
.sumcol .sv .u{font-size:13px;font-weight:600;color:#9AA6B6;margin-left:2px}
.sumcol.r{border-left:1px solid rgba(255,255,255,.1);padding-left:14px}
/* ribbon inside dark card */
.ribbon-wrap{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
.ribbon-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.ribbon-head .t{font-size:12px;color:#9AA6B6;font-weight:600}
.ribbon-head .yr{font-size:12.5px;color:#EAF0F7;font-weight:700;display:flex;gap:6px;align-items:center}
.ribbon-head .yr button{color:#9AA6B6;font-size:16px;padding:0 3px;line-height:1}
.ribbon{display:flex;align-items:flex-end;gap:5px;height:74px}
.rb{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.rb .amt{font-size:9px;color:var(--gold);font-weight:800;height:11px;opacity:0;transition:.2s;white-space:nowrap}
.rb.on .amt{opacity:1}
.rb .col{width:100%;max-width:18px;border-radius:5px 5px 3px 3px;min-height:3px;height:0;transition:height .7s cubic-bezier(.2,.7,.2,1);background:rgba(255,255,255,.1)}
.rb.paid .col{background:linear-gradient(180deg,#4FD08D,#17A45C)}
.rb .m{font-size:9.5px;color:#7A8698;font-weight:600}
.rb.on .m{color:#fff}

/* ---- 2x2 stat grid ---- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}
.gcard{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.gcard .gi{font-size:22px;line-height:1;margin-bottom:12px}
.gcard .gv{font-size:24px;font-weight:800;letter-spacing:-.02em}
.gcard .gv .u{font-size:13px;font-weight:700;color:var(--muted);margin-left:1px}
.gcard .gl{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:5px}
.chip{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;margin-top:8px}
.chip.green{background:var(--green-t);color:var(--green)} .chip.blue{background:var(--blue-t);color:var(--blue)}
.chip.gold{background:#F3EEDF;color:var(--gold)} [data-theme="dark"] .chip.gold{background:#2A2417}
.c-green{color:var(--green)} .c-blue{color:var(--blue)} .c-purple{color:var(--purple)} .c-navy{color:var(--ink)} .c-red{color:var(--red)}

.sec{font-size:13px;font-weight:800;color:var(--ink2);margin:20px 2px 11px}
.sec .cnt{color:var(--muted);font-weight:600;font-size:12px;margin-left:6px}

/* ---- stock card ---- */
.stock{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:11px;position:relative}
.stock-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.stock-id{display:flex;align-items:center;gap:11px;min-width:0}
.tick{width:44px;height:44px;border-radius:13px;background:var(--green-t);color:var(--green);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;letter-spacing:-.02em}
.stock-name{font-weight:800;font-size:15.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cur-chip{font-size:10px;font-weight:800;padding:1px 5px;border-radius:5px;background:#F3EEDF;color:var(--gold);margin-left:6px}
[data-theme="dark"] .cur-chip{background:#2A2417}
.stock-meta{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.yoc-pill{text-align:right;flex:none}
.yoc-pill .n{font-size:23px;font-weight:800;color:var(--green);letter-spacing:-.02em}
.yoc-pill .n small{font-size:13px}
.yoc-pill .l{font-size:10px;color:var(--muted);font-weight:700}
.dv .col .big .side{font-size:12px;font-weight:700;color:var(--muted);margin-left:5px;letter-spacing:0}
.stock-body{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.kv .k{font-size:11px;color:var(--muted);font-weight:600}
.kv .v{font-size:14.5px;font-weight:800;margin-top:2px}
.recov-line{grid-column:1/-1;margin-top:2px}
.recov-line .track{height:7px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:6px}
.recov-line i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green));border-radius:99px;transition:width .8s cubic-bezier(.2,.7,.2,1)}
.recov-line .rr{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;margin-top:6px}
.recov-line .rr .g{color:var(--gold)}
.mini-actions{position:absolute;top:12px;right:12px;display:flex;gap:2px;opacity:0;transition:.15s}
.stock:hover .mini-actions{opacity:1}
.mini-actions button{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.mini-actions button:active{background:var(--bg)}
.mini-actions svg{width:15px;height:15px}

/* ---- calendar ---- */
.cal-year{display:flex;justify-content:center;align-items:center;gap:16px;margin:4px 0 14px;font-weight:800;font-size:17px}
.cal-year button{width:34px;height:34px;border-radius:11px;background:var(--card);box-shadow:var(--shadow);color:var(--ink2);font-size:18px}
.calgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mcell{background:var(--card);border-radius:14px;padding:13px 12px;box-shadow:var(--shadow);min-height:82px;cursor:pointer}
.mcell:active{background:var(--bg)}
.mcell.hit{border:1.5px solid var(--green)}
.mcell .mn-row{display:flex;align-items:baseline;justify-content:space-between;gap:4px;flex-wrap:wrap}
.mcell .mn{font-size:12px;color:var(--muted);font-weight:700}
.mcell .ma{font-size:13px;font-weight:800;letter-spacing:-.02em}
.mcell .ma.z{color:var(--line);font-weight:700;margin-top:9px}
.mcell .mitem{font-size:10.5px;color:var(--ink2);font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcell .cnt{font-size:10.5px;color:var(--green);font-weight:800;margin-top:4px}

/* ---- log ---- */
.logitem{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:15px;padding:12px 14px;box-shadow:var(--shadow);margin-bottom:9px}
.logitem .ldate{font-size:11px;color:var(--muted);font-weight:700;width:52px;flex:none;text-align:center;line-height:1.25}
.logitem .ldate b{display:block;font-size:17px;color:var(--ink);font-weight:800}
.logitem .lmid{flex:1;min-width:0}
.logitem .lname{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logitem .lsub{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
.logitem .lprimary{font-weight:800;font-size:13.5px;color:var(--ink);display:flex;align-items:center;flex-wrap:wrap;gap:5px}
.logitem .lsub2{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px}
.logitem .lamt{text-align:right;flex:none}
.logitem .lamt .g{font-weight:800;font-size:15px;color:var(--green)}
.logitem .lamt .n{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}
.logitem .edit{color:var(--muted);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.logitem .edit:active{background:var(--bg);color:var(--blue)}
.logitem .del{color:var(--muted);width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.logitem .del:active{background:var(--bg);color:var(--red)}
.dg{display:inline-block;font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px;flex:none}
.dg.up{background:var(--green-t);color:var(--green)}
.dg.down{background:var(--red-t);color:var(--red)}
.dg.flat{background:var(--bg);color:var(--muted)}
.dg.new{background:var(--blue-t);color:var(--blue)}
.logGroup{margin-bottom:18px}
.logGroupHead{display:flex;align-items:center;gap:10px;padding:0 2px 10px;cursor:pointer}
.logGroupHead .mid{flex:1;min-width:0}
.logGroupHead .nm{font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logGroupHead .sub{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}
.logGroupHead .rt{text-align:right;flex:none}
.logGroupHead .amt{font-weight:800;font-size:14.5px;color:var(--green)}
.logGroupHead .sub2{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:1px}
.logArrow{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;color:var(--muted)}
.logArrow svg{width:15px;height:15px;transition:transform .2s}
.logArrow.open svg{transform:rotate(180deg)}
.logItems{overflow:hidden;transition:max-height .2s ease}
/* ---- compact single-line dividend row ---- */
.drow{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:9px 11px;box-shadow:var(--shadow);margin-bottom:7px}
.drow .dd{font-size:10.5px;color:var(--muted);font-weight:800;flex:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.drow .dm{flex:1;min-width:0;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.drow .da{flex:none;font-size:13.5px;font-weight:800;color:var(--green);text-align:right;white-space:nowrap;letter-spacing:-.01em}
.drow .da .won{font-size:10px;color:var(--muted);font-weight:600;margin-left:3px}
.drow .edit,.drow .del{color:var(--muted);width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
.drow .edit svg,.drow .del svg{width:15px;height:15px}
.drow .edit:active{background:var(--bg);color:var(--blue)}
.drow .del:active{background:var(--bg);color:var(--red)}
.drow .dg{font-size:9.5px;padding:1px 5px;flex:none}

/* ---- settings ---- */
.setcard{background:var(--card);border-radius:18px;padding:4px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);gap:12px}
.settings-row:last-child{border:none}
.settings-row .sk{font-weight:800;font-size:14px}
.settings-row .sd{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:600}
.switch{width:48px;height:28px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.switch.on{background:var(--green)}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on i{left:23px}
.mini-in{width:96px;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);text-align:right;font-weight:800;outline:none}
.mini-in:focus{border-color:var(--green)}
.sbtn{background:var(--card);border:1.5px solid var(--line);color:var(--ink2);font-weight:700;padding:9px 13px;border-radius:11px;font-size:13px}
.sbtn:active{background:var(--bg)}

/* ---- empty ---- */
.empty{text-align:center;padding:44px 24px;color:var(--muted)}
.empty .em{font-size:42px;margin-bottom:14px}
.empty h3{color:var(--ink);font-size:16px;margin-bottom:7px}
.empty p{font-size:13.5px;line-height:1.6;margin-bottom:18px;font-weight:500}
.empty .seed{display:flex;gap:8px;justify-content:center}
.btn{background:var(--green);color:#fff;font-weight:800;padding:12px 18px;border-radius:13px;font-size:14px}
.btn.ghost{background:var(--card);color:var(--ink2);box-shadow:var(--shadow);border:1.5px solid var(--line)}
.btn.red{background:none;color:var(--red);border:1.5px solid var(--red-t)}

/* ---- FAB ---- */
.fab{position:fixed;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));right:calc(50% - var(--maxw)/2 + 16px);width:56px;height:56px;border-radius:18px;background:var(--green);color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(23,164,92,.42);z-index:40}
@media(max-width:512px){.fab{right:16px}}
.fab svg{width:26px;height:26px}

/* ---- bottom nav ---- */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--maxw);height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--line);display:flex;z-index:35}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:10.5px;font-weight:700;position:relative;padding-top:6px}
.nav button svg{width:23px;height:23px}
.nav button.on{color:var(--ink)}
.nav button.on svg{color:var(--green)}

/* ---- modal ---- */
.scrim{position:fixed;inset:0;background:rgba(10,15,22,.5);backdrop-filter:blur(3px);z-index:60;display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:var(--maxw);border-radius:24px 24px 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 14px}
@keyframes up{from{transform:translateY(30px)}to{transform:translateY(0)}}
.sheet h2{font-size:19px;font-weight:800;margin-bottom:3px}
.sheet .hint{font-size:12.5px;color:var(--muted);margin-bottom:18px;font-weight:600}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:800;color:var(--ink2);margin-bottom:7px}
.field input,.field select{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);outline:none;transition:.15s;font-weight:700}
.field input:focus,.field select:focus{border-color:var(--green)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg-in{display:flex;gap:8px}
.seg-in button{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:800;color:var(--muted);font-size:14px}
.seg-in button.on{border-color:var(--green);background:var(--green-t);color:var(--green)}
.calc-preview{background:var(--green-t);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--green);font-weight:700;margin-bottom:14px;display:none}
.calc-preview.on{display:block}
.sheet-actions{display:flex;gap:10px;margin-top:8px}
.sheet-actions .btn{flex:1;text-align:center;padding:14px}
.sheet-actions .btn.ghost{flex:0 0 auto;padding:14px 20px}
.toast{position:fixed;bottom:calc(var(--nav-h) + 30px);left:50%;transform:translateX(-50%) translateY(16px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;font-size:13px;font-weight:800;opacity:0;transition:.3s;z-index:99;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- account filter chips ---- */
.acct-scroll{display:flex;gap:8px;overflow-x:auto;padding:2px;margin:0 0 2px;-webkit-overflow-scrolling:touch}
.acct-scroll::-webkit-scrollbar{display:none}
.achip{flex:none;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:700;color:var(--ink2);white-space:nowrap}
.achip.on{background:var(--navy);color:#fff}
.achip .dot{width:8px;height:8px;border-radius:50%;flex:none}
/* ---- example banner ---- */
.banner{display:flex;align-items:center;gap:10px;background:var(--gold-soft,#F3EEDF);color:#8A6D2F;border-radius:14px;padding:11px 14px;font-size:12.5px;font-weight:700;margin-bottom:2px}
[data-theme="dark"] .banner{background:#2A2417;color:var(--gold)}
.banner button{margin-left:auto;flex:none;background:#8A6D2F;color:#fff;font-weight:800;font-size:12px;padding:6px 12px;border-radius:9px}
[data-theme="dark"] .banner button{background:var(--gold);color:#1a1206}
/* ---- account badge on stock card ---- */
.acct-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--bg);color:var(--muted);margin-left:6px}
.acct-badge .dot{width:6px;height:6px;border-radius:50%}
/* ---- search autocomplete ---- */
.search-wrap{position:relative}
.search-drop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1.5px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:5;max-height:260px;overflow:auto;display:none}
.search-drop.on{display:block}
.search-item{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);cursor:pointer}
.search-item:last-child{border:none}
.search-item:active{background:var(--bg)}
.search-item .si-tick{font-weight:800;font-size:13px;min-width:52px;color:var(--ink)}
.search-item .si-name{font-size:13px;color:var(--ink2);font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-item .si-mk{font-size:10px;font-weight:800;color:var(--muted);background:var(--bg);padding:2px 6px;border-radius:5px;flex:none}
.search-hint{padding:11px 13px;font-size:12px;color:var(--muted);font-weight:600}
.fx-note{font-size:11px;color:var(--muted);font-weight:600;margin-top:-8px;margin-bottom:14px}
.fx-sub{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:3px}
.fx-note b{color:var(--green)}
/* ---- transaction rows (stock detail) ---- */
.txrow{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}
.txrow:last-child{border:none}
.txyr{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.1em;padding:13px 0 3px;border-bottom:1px solid var(--line)}
.txrow .txl{flex:1;min-width:0}
.txrow .txt1{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txrow .txt1 .d{color:var(--muted);font-weight:700;margin-right:7px;white-space:nowrap}
.txrow .txt1 .p{color:var(--muted);font-weight:600;font-size:11.5px;margin-left:3px}
.txrow .txt2{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px}
.txrow .txv{text-align:right;flex:none;min-width:0}
.txrow .txv1{font-size:13.5px;font-weight:800;white-space:nowrap}
.txrow .txv2{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px;white-space:nowrap}
.tgb{display:inline-block;font-size:9.5px;font-weight:800;padding:1.5px 5px;border-radius:5px;margin-right:5px;vertical-align:1.5px}
.tgb.b{background:var(--red-t);color:var(--red)}
.tgb.s{background:var(--blue-t);color:var(--blue)}
.tgb.r{background:var(--green-t);color:var(--green)}
/* 접기·펼치기 */
.foldsec{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--ink2);margin:16px 2px 8px;cursor:pointer;user-select:none}
.foldsec .flbl,.txyr .flbl{flex:none;white-space:nowrap}
.foldsec .fsum{margin-left:auto;min-width:0;font-size:11.5px;font-weight:700;color:var(--muted);white-space:normal;text-align:right;line-height:1.45}
.foldsec .fchev,.txyr .fchev{flex:none;width:14px;height:14px;transition:transform .18s;color:var(--muted)}
.foldsec.closed .fchev,.txyr.closed .fchev{transform:rotate(-90deg)}
.txyr{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.txyr .fsum{margin-left:auto;min-width:0;font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:0;white-space:normal;text-align:right;line-height:1.45}
[data-foldbody].folded{display:none}
.txrow.tap{cursor:pointer;border-radius:9px}
.txrow.tap:active{background:var(--bg)}
.txrow .del{color:var(--muted);width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
.txrow .del:active{background:var(--bg);color:var(--red)}
.detail-sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:var(--card);border-radius:16px;padding:15px;box-shadow:var(--shadow);margin-bottom:14px}
/* ===== 재설계 상세 카드 ===== */
.dblock{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:15px 16px;margin-bottom:11px}
.dch-tabs{display:flex;gap:5px;background:var(--bg);border-radius:9px;padding:3px;margin:10px 0 4px}
.dch-tabs button{flex:1;border:none;background:none;font:inherit;font-size:11.5px;font-weight:700;color:var(--muted);padding:5px 0;border-radius:7px;cursor:pointer}
.dch-tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,27,39,.12)}
.dch-yrs{display:flex;gap:5px;margin:7px 0 2px}
.dch-yrs button{padding:3px 10px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-size:11px;font-weight:800;color:var(--muted)}
.dch-yrs button.on{border-color:var(--ink2);color:var(--ink);background:var(--bg)}
.dchsvg{width:100%;display:block;overflow:visible;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.dchsvg rect.bar{transition:opacity .12s}
.dchsvg rect.hit{cursor:pointer}
.dch-cap{font-size:11px;color:var(--muted);font-weight:600;text-align:center;margin-top:6px;min-height:30px;line-height:1.45}
.dch-cap b{color:var(--ink2)}
.dch-g{display:flex;border-top:1px solid var(--line);margin-top:11px;padding-top:11px}
.dch-g>div{flex:1;text-align:center;position:relative}
.dch-g>div+div::before{content:'';position:absolute;left:0;top:2px;bottom:2px;width:1px;background:var(--line)}
.dch-g .k{font-size:10px;color:var(--gold);font-weight:800;letter-spacing:.02em}
.dch-g .v{font-size:19px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.dch-g .s{font-size:10px;color:var(--muted);font-weight:600;margin-top:1px}
.dch-yr{font-size:10.5px;color:var(--muted);font-weight:600;display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;margin-top:9px}
.dch-yr b{color:var(--ink2);font-weight:800}
.dch-ref{margin-left:auto;border:none;background:var(--bg);color:var(--muted);width:26px;height:26px;border-radius:8px;padding:5px;cursor:pointer;flex:none}
.dch-ref svg{width:100%;height:100%;display:block}
.dch-note{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:8px;line-height:1.5}
.dbtitle{font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.dbtitle .tg{font-size:10px;font-weight:700;color:var(--muted);background:var(--bg);padding:2px 7px;border-radius:6px;margin-left:auto}
.dpg{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.dpg .k{font-size:11px;color:var(--muted);font-weight:700}
.dpg .k .rein{font-size:9px;color:var(--gold);font-weight:800;background:#F3EEDF;padding:1px 5px;border-radius:5px;margin-left:4px}
[data-theme="dark"] .dpg .k .rein{background:#2A2417}
.dpg .v{font-size:17px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
.dpg .sub{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:2px}
.dpg .vpct{font-size:12.5px;font-weight:800;margin-left:5px;letter-spacing:-.01em}
.qdate{display:inline-block;margin-left:5px;padding:1px 6px;border-radius:6px;background:var(--bg);color:var(--muted);font-size:10.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.qdate.stale{background:rgba(220,60,60,.12);color:var(--red)}
.wf{display:flex;flex-direction:column;gap:11px}
.wf .row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.wf .row .lbl{font-size:13.5px;color:var(--ink2);font-weight:800}
.wf .row .lbl .t{font-weight:600;color:var(--muted);font-size:11px;margin-left:5px}
.wf .row .split{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:3px}
.wf .row .amt{font-size:15px;font-weight:800;white-space:nowrap;text-align:right}
.wf .row .amt .asub{font-size:10.5px;font-weight:700;color:var(--muted);margin-top:2px}
.wf .wfdiv{height:1px;background:var(--line);margin:2px 0}
.wf .total .lbl{font-size:14px;font-weight:800;color:var(--ink)}
.wf .total .amt{font-size:20px;font-weight:800}
.wf .total .amt small{font-size:13px;margin-left:4px}
.dv{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dv .col .k{font-size:11px;color:var(--muted);font-weight:700}
.dv .col .big{font-size:20px;font-weight:800;color:var(--green);margin-top:4px;letter-spacing:-.02em}
.dv .col.y .big{color:var(--blue)}
.dv .col .pct{font-size:12px;font-weight:800;color:var(--gold);margin-top:2px}
.dv .col .krw{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
.cmp{background:linear-gradient(135deg,#123524,#1C2636);color:#EAF0F7;border-radius:16px;padding:16px;margin-bottom:11px;box-shadow:var(--shadow)}
.cmp .dbtitle{color:#9AA6B6} .cmp .dbtitle .tg{background:rgba(255,255,255,.08);color:#9AA6B6}
.cmp .io{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding-bottom:13px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:13px}
.cmp .io .k{font-size:11px;color:#9AA6B6;font-weight:700}
.cmp .io .v{font-size:16px;font-weight:800;color:#fff;margin-top:3px}
.cmp .io .v.win{color:#4FD08D}
.cmp .colhead{display:flex;justify-content:flex-end;margin-bottom:7px}
.cmp .colhead span{font-size:10px;color:#7A8698;font-weight:700;width:74px;text-align:right}
.cmp .cmprow{display:flex;align-items:center;margin-bottom:9px}
.cmp .cmprow .cl{flex:1;font-size:12.5px;color:#C7D0DC;font-weight:700}
.cmp .cmprow .cl small{color:#7A8698;font-weight:600;font-size:10px;display:block;margin-top:1px}
.cmp .cmprow .cum{width:74px;text-align:right;font-size:15px;font-weight:800}
.cmp .cmprow .ann{width:74px;text-align:right;font-size:13px;font-weight:800;color:#9AA6B6}
.cmp .cmprow.win .cum{color:#4FD08D}
.cmp .lift{background:rgba(79,208,141,.14);border-radius:10px;padding:9px 12px;margin-top:6px;font-size:12px;font-weight:700;color:#4FD08D;text-align:center}
.cmp .foot{font-size:10.5px;color:#7A8698;font-weight:600;margin-top:11px;line-height:1.5}
.dhint{background:#F3EEDF;color:#8A6D2F;border-radius:12px;padding:11px 14px;font-size:12px;font-weight:700;line-height:1.5;margin-bottom:11px}
[data-theme="dark"] .dhint{background:#2A2417;color:var(--gold)}
/* ===== 카드보기(정리·A안) ===== */
.stop{display:flex;align-items:center;gap:11px}
.stop .sid{flex:1;min-width:0}
.stop .snm{font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .smeta{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .sret{text-align:right;flex:none}
.stop .sret .p{font-size:19px;font-weight:800;letter-spacing:-.02em}
.stop .sret .l{font-size:10px;color:var(--muted);font-weight:700}
.strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:13px;padding-top:13px;border-top:1px solid var(--line)}
.strip .cell .ck{font-size:10.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .cell .cv{font-size:15px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
.strip .cell .cs{font-size:10.5px;color:var(--muted);font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .cell.mid{border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0 10px}
/* ===== 계좌 성과 카드 + 통장 입출금 ===== */
.acct{background:var(--navy2);color:#EAF0F7;border-radius:20px;padding:19px;box-shadow:var(--shadow);position:relative;overflow:hidden;margin-bottom:14px}
.acct .glow{position:absolute;top:-70px;right:-40px;width:200px;height:200px;background:radial-gradient(circle,rgba(59,130,246,.20),transparent 70%);pointer-events:none}
.acct .ah{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.acct .ah .dot{width:9px;height:9px;border-radius:50%;background:var(--green)}
.acct .ah .anm{font-size:14px;font-weight:800;color:#fff}
.acct .ah .tg{font-size:11px;color:#9AA6B6;font-weight:700;margin-left:auto}
.acct .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.acct .k{font-size:11.5px;color:#9AA6B6;font-weight:700}
.acct .v{font-size:22px;font-weight:800;color:#fff;margin-top:5px;letter-spacing:-.02em}
.acct .col.r{border-left:1px solid rgba(255,255,255,.1);padding-left:14px}
.acct .hero{border-top:1px solid rgba(255,255,255,.1);padding-top:15px}
.acct .hero .lbl{font-size:12px;color:#9AA6B6;font-weight:700}
.acct .hero .big{font-size:28px;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.acct .hero .sub{font-size:12.5px;color:#9AA6B6;font-weight:700;margin-top:5px}
.acct .hero .sub b{color:#5A9BFF}
.acct .divrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid rgba(255,255,255,.1);padding-top:14px;margin-top:14px}
.acct .divrow .v{font-size:18px}
.acct .divrow .v.y{color:#5A9BFF} .acct .divrow .v.g{color:#4FD08D}
.acct .snow{background:rgba(79,208,141,.12);border-radius:12px;padding:11px 13px;margin-top:14px;font-size:12px;font-weight:700;color:#4FD08D;line-height:1.5}
.acct .snow .w{color:#9AA6B6;font-weight:600}
.flowcard{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:15px 16px;margin-bottom:14px}
.pfcard{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:15px 16px;margin-top:11px}
.pfh{display:flex;align-items:center;gap:8px}
.pfh .ttl{font-size:13px;font-weight:800}
.pfchips{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 2px}
.pfchips button{padding:4px 10px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-size:11px;font-weight:800;color:var(--muted)}
.pfchips button.on{border-color:var(--ink2);color:var(--ink);background:var(--bg)}
.pfdate{display:flex;align-items:center;gap:7px;margin:9px 0 2px}
.pfdate input{flex:1;min-width:0;padding:6px 8px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);font:inherit;font-size:12px;font-weight:700;color:var(--ink)}
.pfdate span{color:var(--muted);font-weight:800;font-size:12px}
.pft.c4{table-layout:fixed}
.pft.c4 td:first-child{width:64px}
.pft.c4 td.n{width:70px;font-size:10.5px}
.pft.c4 td.pn{width:48px;text-align:right;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.pft.c4 td.k{width:auto;font-size:11px}
.pft.c4 td.p{width:48px;font-size:10px}
.pft tr.hd td{font-size:9.5px;color:var(--muted);opacity:.7;padding-bottom:1px}
.pfbig{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:9px}
.pfbig .pct{font-size:15px;font-weight:800;margin-left:5px}
.pfsub{font-size:11px;color:var(--muted);font-weight:700;margin-top:2px}
.pfbar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:12px 0 10px;background:var(--bg)}
.pft{width:100%;table-layout:fixed;font-size:12px;font-weight:700}
.pft td{padding:6px 0;color:var(--muted)}
.pft td.n{text-align:right;color:var(--ink2);font-size:11.5px}
.pft td.k{text-align:right;width:96px;color:var(--ink);font-variant-numeric:tabular-nums}
.pft td.p{text-align:right;width:58px;color:var(--muted);font-size:11px}
.pft tr.sep td{border-top:1.5px solid var(--line);padding-top:8px}
.pft tr.tot td{color:var(--ink);font-weight:800;font-size:12.5px}
.pft tr.gap td{padding-top:11px}
.pft tr.sub td{padding:3px 0;font-size:11px;opacity:.78}
.pft tr.sub td:first-child{padding-left:7px}
.mhold.done{opacity:.82}
.mhold.done .ma{font-size:14.5px}
.pft.main td:first-child{color:var(--ink2)}
.pft.m3{table-layout:fixed}
.pft.m3 td:first-child{width:54px;font-size:11.5px}
.pft.m3 td.c{text-align:right;font-size:10.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.pft.m3 td.k{width:auto;font-size:11.5px}
.pft.m3 td.p{width:42px;font-size:10px}
.pfcur{margin-top:13px;padding-top:11px;border-top:1.5px solid var(--line)}
.pfch{font-size:12px;font-weight:800;color:var(--ink2);margin-bottom:2px}
/* 수익 분해 워터폴 — 0에서 출발해 항목별로 오르내리다 합계에 도착한다 */
.pfwf{margin:10px 0 0}
.pfwf svg{display:block;width:100%;height:auto}
/* 항목이 가로(열), 통화가 세로(행) — 열이 워터폴 막대와 정확히 정렬된다 */
.pfwt{width:100%;table-layout:fixed;border-collapse:collapse;margin-top:2px}
.pfwt col.rl{width:11.76%} .pfwt col.c{width:17.65%}
.pfwt td{padding:5px 1px;text-align:center;font-size:10px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.2px;white-space:nowrap}
.pfwt td.rl{text-align:left;color:var(--muted);font-size:10.5px;font-weight:800;letter-spacing:0}
.pfwt tr.hd td{color:var(--muted);font-size:10px;padding-top:0}
.pfwt tr.sep td{border-top:1.5px solid var(--line)}
.pfwt tr.tot td{font-size:10.5px;font-weight:800}
.pfwt tr.tot td.rl{color:var(--ink)}
.pfwt tr.pct td{color:var(--muted);font-size:9.5px;font-weight:700}
.pfnote{font-size:10px;color:var(--muted);font-weight:600;margin-top:7px;line-height:1.45}
/* 통장 통화 전환 */
.fcurseg{display:flex;gap:6px;margin-top:10px}
.fcurseg button{flex:1;padding:7px 0;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font:inherit;font-size:11.5px;font-weight:800;color:var(--muted)}
.fcurseg button.on{border-color:var(--ink2);color:var(--ink);background:var(--bg)}
.tgtcard{background:rgba(107,124,255,.07);border:1.5px dashed rgba(107,124,255,.30);border-radius:16px;padding:14px 16px;margin:14px 0 22px}
[data-theme="dark"] .tgtcard{background:rgba(107,124,255,.11);border-color:rgba(107,124,255,.34)}
.tgtcard .simtag{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;background:rgba(107,124,255,.16);color:#5566E8;font-size:9.5px;font-weight:800;vertical-align:middle}
.tgtcard .fh{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.tgtcard .fh .ttl{font-size:13px;font-weight:800}
.tgtcard .fh .net{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--muted)}
.tgin{display:flex;align-items:center;gap:8px;margin:11px 0 4px}
.tgin label{font-size:11.5px;font-weight:700;color:var(--muted);white-space:nowrap}
.tgin input{flex:1;min-width:0;padding:7px 10px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);font:inherit;font-size:13px;font-weight:800;text-align:right}
.tgwarn{font-size:11px;font-weight:700;color:var(--red);background:rgba(220,60,60,.10);border-radius:8px;padding:6px 9px;margin-top:7px}

// 재투자 자동 판정 — 매수 대금은 '쌓인 배당'을 먼저 쓰고 모자란 만큼만 내 돈으로 본다.

// b.src가 'new'/'reinvest'로 지정돼 있으면 사용자가 직접 정한 것이므로 그대로 따른다.
let _reinvCache=null;
function reinvMap(){
  if(_reinvCache) return _reinvCache;
  const ev=[];
  db.stocks.forEach(s=>{
    const fx=x=>s.currency==='USD'?fxV(x):1;
    db.divs.filter(d=>d.stockId===s.id).forEach(d=>
      ev.push({date:d.date, a:s.accountId, t:'div', amt:divNet(d,s.currency)*divFxKRW(s,d)}));
    db.sells.filter(x=>x.stockId===s.id).forEach(x=>
      ev.push({date:x.date, a:s.accountId, t:'sell'}));            // 매도대금은 원금 회수라 배당 풀에 안 넣는다
    db.buys.filter(b=>b.stockId===s.id).forEach(b=>
      ev.push({date:b.date, a:s.accountId, t:'buy', id:b.id, src:b.src, amt:b.shares*b.price*fx(b)}));
  });
  ev.sort((x,y)=> x.date.localeCompare(y.date) || (x.t==='div'?-1:1));   // 같은 날이면 배당이 먼저 들어온다
  const pool={}, m=new Map();
  ev.forEach(e=>{
    if(e.t==='div'){ pool[e.a]=(pool[e.a]||0)+e.amt; return; }
    if(e.t!=='buy') return;
    let use;
    if(e.src==='reinvest') use=e.amt;                    // 사용자가 전액 재투자로 지정
    else if(e.src==='new') use=0;                        // 사용자가 전액 신규로 지정
    else use=Math.min(Math.max(0,pool[e.a]||0), e.amt);  // 자동: 배당 잔고 먼저 소진
    pool[e.a]=Math.max(0,(pool[e.a]||0)-use);
    m.set(e.id, {krw:use, ratio: e.amt>0 ? use/e.amt : 0, pool:Math.max(0,(pool[e.a]||0))+use});
  });
  _reinvCache=m; return m;
}

//   55 × $0.199 = $10.945 → $10.94  (반올림하면 $10.95가 되어 세후가 1센트 어긋난다)
// 1e-9은 부동소수점 오차 방어 (10.945*100 이 1094.4999... 로 떨어지는 경우).
const curRound=(v,cur)=>{ const x=(+v||0), sg=x<0?-1:1, a=Math.abs(x);
  return cur==='USD' ? sg*Math.floor(a*100+1e-9)/100 : sg*Math.floor(a+1e-9); };
function divGross(d,cur){ return curRound(d.perShare*d.shares, cur); }   // 세전 (반올림 후)
// 증권사 명세와 같은 순서로 계산한다.
//   총 배당금   = 55 × $0.1989 = $10.9395 → $10.94
//   외국납부세금 = $10.94 × 15% = $1.641   → $1.64
//   실수령      = $10.94 − $1.64          = $9.30
// 세후를 한 번에 끊으면 $9.29가 되어 1센트 어긋난다.
function divTax(d,cur){
  if(d.taxFree) return 0;
  const rate = (d.taxPct!=null && d.taxPct!=='') ? d.taxPct/100 : taxDefault(cur);
  return curRound(divGross(d,cur)*rate, cur);
}
function divNetCalc(d,cur){ return curRound(divGross(d,cur) - divTax(d,cur), cur); }
// 최종 실수령액(netFinal)이 입력돼 있으면 그 값이 우선 — 증권사 단수조정 반영

function divNet(d,cur){ return (d.netFinal!=null && d.netFinal!=='') ? (+d.netFinal) : divNetCalc(d,cur); }
function divAdj(d,cur){ return (d.netFinal!=null && d.netFinal!=='') ? ((+d.netFinal) - divNetCalc(d,cur)) : 0; }
/* ---------- XIRR (외부 현금흐름 기준 연복리 수익률) ---------- */
// flows: [{date:'YYYY-MM-DD', amt}], amt 부호: 음수=내 주머니에서 나감(투입), 양수=들어옴(회수/현재가치)
function xirr(flows){
  const fl=flows.filter(f=>f.amt).map(f=>({t:new Date(f.date+'T00:00:00').getTime(), a:f.amt})).sort((x,y)=>x.t-y.t);
  if(fl.length<2) return null;
  if(!(fl.some(f=>f.a>0) && fl.some(f=>f.a<0))) return null;   // 양/음 둘 다 있어야 해(解) 존재
  const t0=fl[0].t, YR=365*86400000;
  const npv=r=> fl.reduce((s,f)=> s + f.a/Math.pow(1+r,(f.t-t0)/YR), 0);
  let lo=-0.9999, hi=10, flo=npv(lo), fhi=npv(hi);
  if(flo*fhi>0){ hi=100; fhi=npv(hi); if(flo*fhi>0) return null; }
  for(let i=0;i<200;i++){ const mid=(lo+hi)/2, fm=npv(mid);
    if(!isFinite(fm)) return null;
    if(Math.abs(fm)<1e-4) return mid;
    if(flo*fm<0){ hi=mid; } else { lo=mid; flo=fm; } }
  return (lo+hi)/2;
}
// 연복리(XIRR)와 외부원금대비(누적)가 왜 다른지 한 줄 설명 (질문 4·5 대응)
function xirrNote(st, firstDate){
  const days = firstDate ? Math.max(1,(Date.now()-new Date(firstDate+'T00:00:00'))/86400000) : 0;
  const mo = days/30.44;
  const period = mo>0 ? (mo<12? `${Math.round(mo)}개월 보유` : `${(mo/12).toFixed(1)}년 보유`) : '';
  if(st.reinvKRW>0){
    return `${period} · 연환산(복리) 기준 — 배당 재투자 효과까지 XIRR에 반영`;
  }
  const sub = mo<11.5 ? '1년 미만이라 연환산 시 손익이 확대됨' : (mo>12.5 ? '1년 초과라 연환산 시 완만해짐' : '보유≈1년이라 둘이 거의 같음');
  return `재투자 없음 → 차이는 순수 '연환산' 효과 · ${period}, ${sub}`;
}
function stockStats(s){
  const bs=buysOf(s.id), sl=sellsOf(s.id);
  let buyShares=0,buyCostNative=0,buyCostKRW=0;
  let extInKRW=0, reinvKRW=0, reinvNative=0;                                    // 자금출처별 분리
  bs.forEach(b=>{ const fx=s.currency==='USD'?fxV(b):1; buyShares+=b.shares; buyCostNative+=b.shares*b.price; buyCostKRW+=b.shares*b.price*fx;
    const krw=b.shares*b.price*fx;
    const rr=reinvOfBuy(b);                                        // 0~1 : 그 매수 중 배당에서 나온 비율
    reinvKRW+=krw*rr; reinvNative+=b.shares*b.price*rr; extInKRW+=krw*(1-rr); });
  const avgPrice = buyShares>0? buyCostNative/buyShares : 0;
  const avgFx = buyCostNative>0? buyCostKRW/buyCostNative : 1;
  let sellShares=0, realizedKRW=0, realizedNative=0, sellProceedKRW=0, realizedPriceKRW=0, realizedFxKRW=0;
  sl.forEach(x=>{ const fx=s.currency==='USD'?fxV(x):1; sellShares+=x.shares; sellProceedKRW+=x.shares*x.price*fx;
    realizedNative += x.shares*(x.price-avgPrice);
    realizedKRW += x.shares*(x.price*fx - avgPrice*avgFx);
    realizedPriceKRW += x.shares*(x.price-avgPrice)*avgFx;   // 매매(가격변동, 매입환율 환산)
    realizedFxKRW += x.shares*x.price*(fx-avgFx); });         // 환차(매도환율 vs 매입환율)
  const shares = Math.max(0, buyShares-sellShares);
  const costNative = avgPrice*shares;
  const costKRW = avgPrice*avgFx*shares;
  // dividends — 오늘환율(현재가치) + 지급일환율(받을 때 가치)로 분해해 배당 환차 산출
  let cumNetKRW=0, cumNetNative=0, divCoreKRW=0, ttmGrossNative=0, ttmGrossKRW=0, ttmNetNative=0, ttmNetKRW=0;
  let ttmDpsGross=0, ttmDpsNet=0, ttmCount=0;   // 직전 1년 주당배당(세전/세후) · 건수
  let cumTaxNative=0, cumTaxKRW=0;              // 누적 원천징수 세액
  const todayFxD = s.currency==='USD' ? todayFx() : 1;
  divsOf(s.id).forEach(d=>{ const net=divNet(d,s.currency); const payFx=s.currency==='USD'?fxV(d):1;
    cumNetKRW+=net*todayFxD; cumNetNative+=net; divCoreKRW+=net*payFx;          // 오늘 / native / 받을때
    { const tx=Math.max(0, divGross(d,s.currency) - net); cumTaxNative+=tx; cumTaxKRW+=tx*payFx; }   // 원천징수 세액
    if(daysAgo(d.date)<=365){ const g=divGross(d,s.currency); ttmGrossNative+=g; ttmGrossKRW+=g*todayFxD; ttmNetNative+=net; ttmNetKRW+=net*todayFxD;
      if(d.shares>0){ ttmDpsGross+=d.perShare; ttmDpsNet+=net/d.shares; ttmCount++; } } });
  const divFxGainKRW = cumNetKRW - divCoreKRW;                                    // 배당 환차 (오늘 - 받을때)
  // ── YOC는 주당배당 기준 (= 가중평균 보유주수 기준과 동일) ──
  // 실수령 합계는 과거 주수로 쌓이는데 분모는 현재 주수라, 추매하면 YOC가 눌린다.
  // 분자·분모를 모두 '주당'으로 맞추면 주수가 상쇄돼 추매와 무관한 값이 된다.
  const ascD=[...divsOf(s.id)].sort((a,b)=>a.date.localeCompare(b.date));
  const freqD = ascD.length>=2 ? divFreqDays(ascD) : null;
  const expCnt = (freqD && freqD>=20) ? Math.round(365/freqD) : null;              // 1년 예상 지급 횟수
  const ttmPartial = !!(expCnt && ttmCount>0 && ttmCount<expCnt);                  // 보유 1년 미만 → 구간 미달
  const annF = ttmPartial ? expCnt/ttmCount : 1;                                   // 주기로 연환산
  const dpsNet = ttmDpsNet*annF, dpsGross = ttmDpsGross*annF;                      // 연 주당배당 (세후/세전)
  const wAvgShares = ttmDpsNet>0 ? ttmNetNative/ttmDpsNet : shares;                // 직전 1년 가중평균 보유주수
  // live
  const pc=priceCache[s.id]; const price=(pc&&isFinite(pc.price))?pc.price:null;
  const fxn = s.currency==='USD' ? todayFx() : 1;
  let evalKRW=null, unrealKRW=null, priceEffectKRW=null, fxEffectKRW=null;
  if(price!=null && fxn!=null){
    evalKRW=shares*price*fxn; unrealKRW=evalKRW-costKRW;
    if(s.currency==='USD'){
      priceEffectKRW = shares*(price-avgPrice)*avgFx;   // 가격변동을 매입환율로 환산한 부분
      fxEffectKRW = shares*price*(fxn-avgFx);            // 현재가 기준으로 환율변동만 반영한 부분 (둘의 합=unrealKRW)
    } else { priceEffectKRW = unrealKRW; fxEffectKRW = 0; }
  }
  const totalKRW = (unrealKRW!=null?unrealKRW:0)+realizedKRW+cumNetKRW;
  // ── 외부원금 기준 (배당 재투자는 내 돈으로 안 침) ──
  const netExtKRW = extInKRW - sellProceedKRW;                                  // 외부 순투입 (신규매수 - 매도회수)
  const todayFxS = s.currency==='USD' ? todayFx() : 1;
  const leftoverCashNative = Math.max(0, cumNetNative - reinvNative);           // 아직 재투자 안 한 배당현금(native)
  const leftoverCashKRW = leftoverCashNative * todayFxS;
  const totalValueKRW = (evalKRW!=null?evalKRW:costKRW) + leftoverCashKRW;      // 현재 총가치(주식+미투자현금)
  const profitExtKRW = totalValueKRW - netExtKRW;                              // 외부원금 대비 총이익
  const retExtPct = netExtKRW>0 ? profitExtKRW/netExtKRW*100 : 0;
  // ── XIRR (연환산·현금흐름 가중) · 보유 90일 미만이면 과격해서 숨김 ──
  const firstBuyDate = bs.length? bs[0].date : null;
  const holdDays = firstBuyDate ? (Date.now()-new Date(firstBuyDate+'T00:00:00'))/86400000 : 0;
  const xirrOK = evalKRW!=null && holdDays>=90;
  let extXirrPct=null, platXirrPct=null;
  if(xirrOK){
    // 외부기준: 신규매수(-), 매도(+), 오늘 총가치(주식+미투자현금)(+) — 재투자·배당은 내부현금이라 제외
    if(netExtKRW>0){
      const f=[];
      bs.forEach(b=>{ if((b.src||'new')!=='reinvest'){ const fx=s.currency==='USD'?fxV(b):1; f.push({date:b.date, amt:-(b.shares*b.price*fx)}); } });
      sl.forEach(x=>{ const fx=s.currency==='USD'?fxV(x):1; f.push({date:x.date, amt:+(x.shares*x.price*fx)}); });
      f.push({date:todayISO(), amt:+totalValueKRW});
      const r=xirr(f); if(r!=null) extXirrPct=r*100;
    }
    // 평단기준: 모든 매수(재투자 포함)(-), 배당 수령(지급일환율)(+), 매도(+), 오늘 평가액(+)
    if(buyCostKRW>0){
      const f=[];
      bs.forEach(b=>{ const fx=s.currency==='USD'?fxV(b):1; f.push({date:b.date, amt:-(b.shares*b.price*fx)}); });
      divsOf(s.id).forEach(d=>{ const payFx=s.currency==='USD'?fxV(d):1; f.push({date:d.date, amt:+(divNet(d,s.currency)*payFx)}); });
      sl.forEach(x=>{ const fx=s.currency==='USD'?fxV(x):1; f.push({date:x.date, amt:+(x.shares*x.price*fx)}); });
      f.push({date:todayISO(), amt:+(evalKRW!=null?evalKRW:costKRW)});
      const r=xirr(f); if(r!=null) platXirrPct=r*100;
    }
  }
  return { buyShares,buyCostKRW,avgPrice,avgFx,shares,costNative,costKRW,
    realizedKRW,realizedNative,realizedPriceKRW,realizedFxKRW,cumNetKRW,cumNetNative,divCoreKRW,divFxGainKRW,ttmGrossNative,ttmGrossKRW,ttmNetNative,ttmNetKRW,
    price,evalKRW,unrealKRW,priceEffectKRW,fxEffectKRW,totalKRW,
    extInKRW,reinvKRW,reinvNative,sellProceedKRW,netExtKRW,leftoverCashNative,leftoverCashKRW,totalValueKRW,profitExtKRW,retExtPct,
    holdDays,xirrShort:(evalKRW!=null&&holdDays<90),extXirrPct,platXirrPct,xirrPct:extXirrPct,
    recovNative: costNative>0? cumNetNative/costNative*100:0,                   // 원금대비 배당(외화)
    cumTaxNative, cumTaxKRW,
    ttmDpsGross,ttmDpsNet,dpsNet,dpsGross,wAvgShares,ttmPartial,ttmCount,
    ttmNetNormNative: dpsNet*shares, ttmNetNormKRW: dpsNet*shares*todayFxD,     // 현재 주수로 정규화한 연배당
    yocKRW: (avgPrice*avgFx)>0? (dpsNet*todayFxD)/(avgPrice*avgFx)*100:0,       // 연 YOC (원화·주당기준)
    yoc: avgPrice>0? dpsNet/avgPrice*100:0,                                    // 세후 YOC (외화·주당기준)
    recov: costKRW>0? cumNetKRW/costKRW*100:0,                                 // 원금대비 누적 세후 배당률(원화)
    unrealPct: costKRW>0 && unrealKRW!=null? unrealKRW/costKRW*100:0,          // 원금(보유분)대비 평가 수익률
    // 투자 통화 기준 순수 평가손익률 = (현재가-평단)/평단. 배당·환차·실현손익 모두 제외.
    priceNativePct: (avgPrice>0 && price!=null)? (price-avgPrice)/avgPrice*100 : null,
    totalPct: buyCostKRW>0? totalKRW/buyCostKRW*100:0 };                       // 매매+평가+배당 다 합친 누적 총수익률
}
function stocksIn(){ return db.stocks.filter(s=> filterAcct==='all'||s.accountId===filterAcct); }
/* ---------- 통장 입출금 / 계좌 성과 ---------- */
function flowsIn(){ return db.flows.filter(f=> filterAcct==='all'||f.accountId===filterAcct).sort((a,b)=>a.date.localeCompare(b.date)); }
function netDeposit(){ return flowsIn().reduce((s,f)=> s + (f.type==='out'? -Math.abs(f.amount) : Math.abs(f.amount)), 0); }
// 매수/매도에 연동된 자동 입출금 생성·갱신·삭제 (수수료 반영해 사용자가 수정 가능)
// 매수·매도는 통장에 가짜 입출금을 만들지 않는다. 예수금에서 직접 나가고 들어올 뿐.
// 통장 flows = 은행 ↔ 증권계좌 실제 이체만.
function syncBuyFlow(){}
function syncSellFlow(){}
function removeFlowForBuy(id){ db.flows=db.flows.filter(f=>f.buyId!==id); }
function removeFlowForSell(id){ db.flows=db.flows.filter(f=>f.sellId!==id); }
function ytdNet(year){ // 올해(또는 지정연도) 1/1~오늘(같은 월·일)까지 세후배당 KRW — 전년 동기 공정 비교용
  const md = (now.getMonth()+1)*100 + now.getDate();
  let v=0; db.divs.forEach(d=>{ const s=stById(d.stockId); if(!s) return; if(filterAcct!=='all'&&s.accountId!==filterAcct) return;
    const dt=new Date(d.date); if(dt.getFullYear()!==year) return; if((dt.getMonth()+1)*100+dt.getDate()>md) return;
    v += divNet(d,s.currency)*(s.currency==='USD'?todayFx():1); });
  return v; }
function accountPerf(){
  const p=portfolio();
  const dep=netDeposit();                              // 순투입(통장 입금-출금)
  let leftover=0, buyTotalKRW=0;
  stocksIn().forEach(s=>{ const st=stockStats(s); leftover+=st.leftoverCashKRW||0; buyTotalKRW+=st.buyCostKRW; });
  // 분모는 '내가 매수에 쓴 돈' 전체. 분자도 같은 눈높이로 평가액+배당+매도대금을 모두 담는다.
  //   이익 = Σ평가액 + Σ매도대금 + Σ배당 − Σ매수원가 = Σ(종목별 총수익)
  const totalValue = p.evalK + p.cum + (p.sellProceed||0);
  // 재투자는 매수 기록에 붙은 자금출처(src='reinvest')로만 센다.
  const reinv = p.reinv || 0;
  // 외부에서 넣은 돈 = 신규매수 − 매도대금. 통장 이체가 이보다 많으면(예치금이 남아 있으면) 통장을 쓴다.
  const extFromTrades = Math.max(0, p.netExt||0);      // 종목별 (신규매수 − 매도회수) 합계
  const base = buyTotalKRW;
  const depShort = extFromTrades - dep;                // 통장에 아직 안 적은 입금 추정액
  const profit = totalValue - base;
  const yThis=now.getFullYear();
  const ytdThis=ytdNet(yThis), ytdPrev=ytdNet(yThis-1);
  // 계좌 XIRR: 입금(-)·출금(+)·오늘 총가치(+)  [외부기준 연복리]
  // 통장에 실제 이체가 충분히 기록돼 있으면 그걸 쓰고, 아니면 신규매수(-)·매도(+)를 외부 현금흐름으로 대체
  // 연 수익률: 누적과 같은 눈높이 — 매수 전액(-) · 배당(+) · 매도(+) · 오늘 평가액(+)
  let xirrPct=null;
  { const f=[];
    stocksIn().forEach(s=>{ const cur=s.currency==='USD';
      buysOf(s.id).forEach(b=>f.push({date:b.date, amt:-(b.shares*b.price*(cur?fxV(b):1))}));
      sellsOf(s.id).forEach(x=>f.push({date:x.date, amt:+(x.shares*x.price*(cur?fxV(x):1))}));
      divsOf(s.id).forEach(d=>f.push({date:d.date, amt:+(divNet(d,s.currency)*(cur?fxV(d):1))})); });
    f.sort((a,b)=>a.date.localeCompare(b.date));
    if(f.length && p.evalK>0){ f.push({date:todayISO(), amt:+p.evalK}); const r=xirr(f); if(r!=null) xirrPct=r*100; } }
  // 외부자금 기준 XIRR은 스노우볼(재투자 효과) 산출에만 쓴다
  let extXirr=null;
  { const f=[];
    stocksIn().forEach(s=>{ const fx=x=>s.currency==='USD'?fxV(x):1;
      db.buys.filter(b=>b.stockId===s.id).forEach(b=>{ const ext=1-reinvOfBuy(b); if(ext>0) f.push({date:b.date, amt:-(b.shares*b.price*fx(b)*ext)}); });
      db.sells.filter(x=>x.stockId===s.id).forEach(x=>f.push({date:x.date, amt:+(x.shares*x.price*fx(x))})); });
    f.sort((a,b)=>a.date.localeCompare(b.date));
    if(f.length && totalValue>0){ f.push({date:todayISO(), amt:+totalValue}); const r=xirr(f); if(r!=null) extXirr=r*100; } }
  // 평단기준 연복리: 전 종목 매수(-)·배당(+)·매도(+)·오늘 평가액(+)  → 스노우볼(연) = 외부 - 평단
  let platXirr=null;
  { const f=[]; stocksIn().forEach(s=>{ const cur=s.currency==='USD';
      buysOf(s.id).forEach(b=>f.push({date:b.date,amt:-(b.shares*b.price*(cur?fxV(b):1))}));
      sellsOf(s.id).forEach(x=>f.push({date:x.date,amt:+(x.shares*x.price*(cur?fxV(x):1))}));
      divsOf(s.id).forEach(d=>f.push({date:d.date,amt:+(divNet(d,s.currency)*(cur?fxV(d):1))})); });
    if(f.length && p.evalK>0){ f.push({date:todayISO(),amt:+p.evalK}); const r=xirr(f); if(r!=null) platXirr=r*100; } }
  const snowballAnnual = (extXirr!=null && xirrPct!=null) ? (extXirr - xirrPct) : null;
  return { dep, hasDep:dep>0||flowsIn().length>0, base, totalValue, leftover, profit, extXirr, sellProceed:p.sellProceed||0,
    retPct: base>0? profit/base*100:0, xirrPct, platXirr, snowballAnnual,
    evalK:p.evalK, cum:p.cum, yoc:p.yoc, buyTotalKRW, reinv, extFromTrades, depShort,
    ytdThis, ytdPrev, ytdGrowth: ytdPrev>0? (ytdThis-ytdPrev)/ytdPrev*100 : null, yThis };
}

  const nm = filterAcct==='all' ? '전체 계좌' : (acctById(filterAcct)?acctById(filterAcct).name:'계좌');
  const nc=v=>v>=0?'#4FD08D':'#F0605F';
  const g = ap.ytdGrowth;
  const growthChip = g==null? '' : `<span style="font-size:11px;color:${g>=0?'#4FD08D':'#F0605F'}"> ${g>=0?'▲':'▼'} ${(g>=0?'+':'')}${g.toFixed(0)}%</span>`;
  return `<div class="acct"><div class="glow"></div>
    <div class="ah"><span class="dot"></span><span class="anm">${esc(nm)}</span><span class="tg">계좌 성과 · 매수원가 기준</span></div>
    <div class="two">
      <div class="col"><div class="k">🏦 총매수 (매수원가 합계)</div><div class="v num">${fmtK(ap.base)}</div></div>
      <div class="col r"><div class="k">💼 회수 + 평가</div><div class="v num">${fmtK(ap.totalValue)}</div><div class="k" style="margin-top:3px">평가 ${fmtK(ap.evalK).replace('₩','')} + 배당 ${fmtK(ap.cum).replace('₩','')}${ap.sellProceed>0?` + 매도 ${fmtK(ap.sellProceed).replace('₩','')}`:''}</div></div>
    </div>
    <div class="hero">
      <div class="lbl">총수익 · 매수원가 대비 · 종목 합계와 일치</div>
      <div class="big num" style="color:${nc(ap.profit)}">${fmtSigned(ap.profit)} <span style="font-size:16px">${ap.base>0?pctS(ap.retPct):''}</span></div>
      ${ap.xirrPct!=null?`<div class="sub">연복리(XIRR) <b>${pctS(ap.xirrPct)}</b> · 매수·배당·매도 시점을 반영한 복리수익률</div>`:''}
    </div>
    <div class="divrow">
      <div class="col"><div class="k">🌾 배당수익률 (YOC·세후)</div><div class="v y num">연 ${ap.yoc.toFixed(1)}%</div></div>
      <div class="col"><div class="k">💰 누적 배당 (세후)</div><div class="v g num">${fmtSigned(ap.cum)}</div></div>
    </div>
    <div class="divrow" style="border-top:none;padding-top:0;margin-top:12px">
      <div class="col"><div class="k">📅 올해 배당 (${ap.yThis}·세후)</div><div class="v g num">${fmtK(ap.ytdThis)}${growthChip}</div><div class="k" style="margin-top:3px">${ap.ytdPrev>0?`전년 동기 ${fmtK(ap.ytdPrev)} 대비`:'전년 데이터 없음'}</div></div>
      <div class="col"><div class="k">🗓 작년 동기 (${ap.yThis-1})</div><div class="v num" style="color:#C7D0DC">${fmtK(ap.ytdPrev)}</div><div class="k" style="margin-top:3px">1/1~오늘</div></div>
    </div>
    ${ap.reinv>0?`<div class="snow">🌾 총매수 ${fmtK(ap.buyTotalKRW)} 중 <b>재투자 ${fmtK(ap.reinv)}</b><br><span class="w">매수할 때 '배당 재투자'로 표시한 금액 (계좌 전체)</span></div>`:''}
    ${ap.depShort>10000?`<div class="snow" style="background:rgba(220,60,60,.10)">🏦 통장 입금이 <b>${fmtK(ap.depShort)}</b> 모자라요<br><span class="w">거래 기준으로 계산 중 · 통장에 실제 입금을 넣으면 정확해져요</span></div>`:''}
  </div>`;
}
let flowFold=true, flowFilter='all';          // 통장: 기본 접힘 · all|bank|stock|div|etc
let flowCur='USD';                            // 통장 탭: USD(외화 통장) | KRW(원화 통장)
// 통장은 둘로 나뉜다. 외화 통장 = 외화 입출금 + 해외종목 매매·배당,
// 원화 통장 = 원화 입출금 + 국내종목 매매·배당. 서로 섞지 않는다(환산 없음).
const bookOfFlow=f=>(f.book==='krw'?'krw':'fx');   // 예전 기록은 전부 외화 통장
const flowYearFold={}, flowMonthFold={};      // 연·월 접기 (최근 것만 기본 펼침)
// 예수금 원장 — 은행 이체(flows) + 매수/매도 + 배당을 시간순으로 합친다.
// 금액은 투자 통화(USD) 기준. 원화만 있는 은행 이체는 현재 환율로 환산.
// 배당 재투자 매수에 딸린 자동 입금은 내 돈이 아니므로 제외해야 배당이 잔액에서 정상 차감된다.
// cat: bank(내 돈) · stock(매수·매도와 그 연동 이체) · div(배당) · etc(연결 끊긴 자동 기록)
function ledgerEntries(book){
  const bk = book==='krw' ? 'krw' : 'fx';
  const isFx = bk==='fx';
  const inAcct=x=>filterAcct==='all'||x.accountId===filterAcct;
  const buyById=new Map(db.buys.map(b=>[b.id,b])), sellById=new Map(db.sells.map(x=>[x.id,x]));
  const rate=()=> todayFx();
  const E=[];
  flowsIn().forEach(f=>{
    if(bookOfFlow(f)!==bk) return;           // 다른 통장의 기록은 건드리지 않는다
    const b=f.buyId?buyById.get(f.buyId):null, x=f.sellId?sellById.get(f.sellId):null;
    if(b && b.src==='reinvest') return;      // 전액 재투자로 지정된 매수의 옛 자동입금은 제외
    const sg=(f.type==='out'?-1:1), krw=Math.abs(f.amount);
    // 외화 통장은 달러 기준, 원화 통장은 원 기준 — 통장끼리 환산하지 않는다
    const amt = isFx ? ((f.cur==='USD' && f.amtNative>0) ? f.amtNative : krw/rate()) : krw;
    // 이 거래의 실제 적용환율 — 환전 기록이면 원화액÷달러액이 그대로 토스 적용환율이다
    const fxr = isFx ? ((f.cur==='USD' && f.amtNative>0) ? (f.fx>0?f.fx:krw/f.amtNative) : rate()) : 1;
    const cat = f.auto ? 'etc' : 'bank';                 // 옛 자동 기록이 남아 있으면 기타로
    const tag=(f.cur&&f.cur!=='KRW'&&f.cur!=='USD')?` (${Number(f.amtNative).toLocaleString('en-US',{maximumFractionDigits:2})} ${f.cur})`:'';
    E.push({date:f.date, amt:sg*amt, fxr, label:(f.memo||(f.type==='out'?'출금':'입금'))+tag,
            kind:f.auto?'move':'bank', cat, edited:f.edited, flowId:f.id, xfId:f.xfId});
  });
  // 종목도 통화로 갈라 담는다 — 외화 통장엔 해외종목만, 원화 통장엔 국내종목만
  db.stocks.filter(inAcct).filter(s=> isFx ? s.currency!=='KRW' : s.currency==='KRW').forEach(s=>{
    const amtOf=(q,px,fee)=>{ const v=q*px+(+fee||0);            // 수수료까지 실제 오간 현금
      return (isFx && s.currency!=='USD') ? v/rate() : v; };
    const rOf=x=> (isFx && s.currency==='USD') ? ((x&&x.fx>0)?x.fx:rate()) : 1;   // 거래시점 환율
    db.buys.filter(b=>b.stockId===s.id).forEach(b=>E.push({date:b.date, amt:-amtOf(b.shares,b.price,b.fee),
      fxr:rOf(b), label:'매수 '+dispTk(s)+(b.fee>0?' +수수료':''), kind:'buy', cat:'stock'}));
    db.sells.filter(x=>x.stockId===s.id).forEach(x=>E.push({date:x.date, amt:+amtOf(x.shares,x.price,-(+x.fee||0)),
      fxr:rOf(x), label:'매도 '+dispTk(s)+(x.fee>0?' −수수료':''), kind:'sell', cat:'stock'}));
    db.divs.filter(d=>d.stockId===s.id).forEach(d=>{ const n=divNet(d,s.currency);
      E.push({date:d.date, amt:n, fxr:rOf(d), label:'배당 '+dispTk(s), kind:'div', cat:'div'}); });
  });
  const ord={bank:0,move:0,sell:1,div:1,buy:2};
  E.sort((a,b)=> a.date.localeCompare(b.date) || ((ord[a.kind]??1)-(ord[b.kind]??1)));
  let bal=0; E.forEach(e=>{ bal+=e.amt; e.bal=bal; });     // 누적 예수금 (그 통장의 통화 기준)
  return E;
}
// 외화 예수금의 평균 취득환율 — 들어올 때 가중평균, 나갈 때 그 평균과의 차이를 실현 환차로 뗀다.
// 환전으로 들어온 달러는 원화액÷달러액이 실제 적용환율이라 스프레드까지 반영된다.
function fxCostBook(E){
  let qty=0, avg=0, realized=0;
  E.forEach(e=>{ const r=(e.fxr>0)?e.fxr:todayFx();
    if(e.amt>0){ const q=e.amt; avg=(qty*avg+q*r)/((qty+q)||1); qty+=q; }
    else if(e.amt<0){ const q=Math.min(qty,-e.amt); if(q>0&&avg>0) realized+=q*(r-avg); qty=Math.max(0,qty+e.amt); } });
  return { qty, avg, realized, unreal: (qty>0&&avg>0)? qty*(todayFx()-avg) : 0 };
}
function ledgerSummary(E){
  const sum=fn=>E.filter(fn).reduce((a,e)=>a+e.amt,0);
  return { myIn:sum(e=>(e.cat==='bank'||e.cat==='etc')&&e.amt>0),
           myOut:sum(e=>(e.cat==='bank'||e.cat==='etc')&&e.amt<0),
           div:sum(e=>e.cat==='div'), buy:sum(e=>e.kind==='buy'), sell:sum(e=>e.kind==='sell'),
           bal: E.length? E[E.length-1].bal : 0 };
}

function portfolio(){
  let cost=0,cum=0,ttmN=0,evalK=0,unreal=0,realized=0,buyAll=0,anyPrice=false,priceEff=0,fxEff=0,anyUSD=false;
  let netExt=0,reinv=0,totalVal=0,leftoverK=0,anyReinv=false,sellProceed=0;
  const flows=[];
  stocksIn().forEach(s=>{ const st=stockStats(s); cost+=st.costKRW; cum+=st.cumNetKRW; ttmN+=st.ttmNetNormKRW; realized+=st.realizedKRW; buyAll+=st.buyCostKRW;
    netExt+=st.netExtKRW; reinv+=st.reinvKRW; leftoverK+=st.leftoverCashKRW; totalVal+=st.totalValueKRW; sellProceed+=st.sellProceedKRW||0; if(st.reinvKRW>0) anyReinv=true;
    // 포트폴리오 XIRR용 현금흐름 (신규매수-, 매도+)
    buysOf(s.id).forEach(b=>{ const ext=1-reinvOfBuy(b); if(ext<=0) return;
      const fx=s.currency==='USD'?fxV(b):1; flows.push({date:b.date, amt:-(b.shares*b.price*fx*ext)}); });
    sellsOf(s.id).forEach(x=>{ const fx=s.currency==='USD'?fxV(x):1; flows.push({date:x.date, amt:+(x.shares*x.price*fx)}); });
    if(st.evalKRW!=null){ evalK+=st.evalKRW; unreal+=(st.unrealKRW||0); anyPrice=true;
      if(s.currency==='USD'){ anyUSD=true; priceEff+=(st.priceEffectKRW||0); fxEff+=(st.fxEffectKRW||0); } else { priceEff+=(st.unrealKRW||0); } } });
  const total = unreal+realized+cum;
  const profitExt = totalVal - netExt;
  let xirrPct=null;
  if(anyPrice && netExt>0){ flows.push({date:todayISO(), amt:+totalVal}); const r=xirr(flows); if(r!=null) xirrPct=r*100; }
  return { cost,cum,ttmN,evalK,unreal,realized,buyAll,anyPrice,total,priceEff,fxEff,anyUSD,
    netExt,reinv,leftoverK,totalVal,profitExt,anyReinv,xirrPct,sellProceed,
    retExtPct: netExt>0? profitExt/netExt*100:0,
    yoc: cost>0?ttmN/cost*100:0, recov: cost>0?cum/cost*100:0,                 // 세후 YOC
    totalPct: buyAll>0? total/buyAll*100:0, unrealPct: cost>0? unreal/cost*100:0 };
}
function monthlyNetKRW(year){ const a=new Array(12).fill(0);
  db.divs.forEach(d=>{ const s=stById(d.stockId); if(!s) return; if(filterAcct!=='all'&&s.accountId!==filterAcct) return;
    const dt=new Date(d.date); if(dt.getFullYear()!==year) return; const fx=divFxKRW(s,d); a[dt.getMonth()]+=divNet(d,s.currency)*fx; });
  return a; }
function yearNetGross(year){ let net=0,gross=0;
  db.divs.forEach(d=>{ const s=stById(d.stockId); if(!s) return; if(filterAcct!=='all'&&s.accountId!==filterAcct) return;
    if(new Date(d.date).getFullYear()!==year) return; const fx=divFxKRW(s,d); const g=divGross(d,s.currency); gross+=g*fx; net+=divNet(d,s.currency)*fx; });

function thisMonth(){ let amt=0,cnt=0;

/* ---------- live fetch ---------- */
async function loadLive(force){
  if(liveLoading) return;
  // 쿨다운: 캐시가 비어 있어도 60초 내에는 재요청하지 않음 → 가격이 안 올 때 발생하던 무한 재요청·아이콘 깜빡임 방지
  if(!force && Date.now()-liveTs<60000) return;
  if(!db.stocks.length || !backendBase()) return;
  liveLoading=true;
  let changed=false;
  const applyPrice=(s,p)=>{ if(p&&typeof p.price==='number'&&isFinite(p.price)){ const pc=priceCache[s.id]; if(!pc||pc.price!==p.price){ priceCache[s.id]={price:p.price,date:p.date}; changed=true; } } };
  // 환율
  const fxTask = db.stocks.some(s=>s.currency==='USD')
    ? apiGet('/fxrate').then(r=>{ if(r&&r.rate){ try{ localStorage.setItem('tmt.fxnow', String(r.rate)); }catch(e){}
        if(r.rate!==fxNow){ fxNow=r.rate; changed=true; } } })
    : Promise.resolve();
  // 현재가: 일괄(/prices) 한 번에 → 구버전 백엔드(404)면 종목별 폴백
  const items = db.stocks.map(s=>encodeURIComponent(s.ticker)+':'+encodeURIComponent(s.market||'')).join(',');
  const priceTask = apiGet('/prices?items='+items).then(async r=>{
    if(r && r.prices && typeof r.prices==='object'){
      db.stocks.forEach(s=>applyPrice(s, r.prices[s.ticker]));
      return;
    }
    // 폴백: 종목별 개별 요청
    await Promise.all(db.stocks.map(s=>apiGet('/price?ticker='+encodeURIComponent(s.ticker)+'&market='+encodeURIComponent(s.market||'')).then(p=>applyPrice(s,p))));
  });
  await Promise.all([fxTask, priceTask]);
  liveLoading=false; liveTs=Date.now();
  // 실제로 값이 바뀐 경우에만 재렌더 (실패 시 재렌더 안 함 → 루프·깜빡임 차단)
  if(changed && (tab==='dash'||tab==='stocks')) render();
}

/* ---------- routing ---------- */
function reconcileFlows(){
  // 삭제된 매수/매도에 연동된 자동 입출금 제거
  db.flows=db.flows.filter(f=> !(f.buyId && !db.buys.find(b=>b.id===f.buyId)) && !(f.sellId && !db.sells.find(x=>x.id===f.sellId)));
  // 매수→입금, 매도→출금 자동 생성/갱신 (edited=true 인 건 금액 보존=수수료 반영분)
  db.buys.forEach(b=>syncBuyFlow(b));
  db.sells.forEach(x=>syncSellFlow(x));
}

}

function sortStocks(list){
  const arr=[...list]; const st=s=>stockStats(s);
  if(stockSort==='name') arr.sort((a,b)=>a.name.localeCompare(b.name));
  else if(stockSort==='yoc') arr.sort((a,b)=>st(b).yoc-st(a).yoc);
  else if(stockSort==='plpct') arr.sort((a,b)=>{const A=st(a),B=st(b);return (B.priceNativePct??-1e9)-(A.priceNativePct??-1e9);});
  else arr.sort((a,b)=>(st(b).evalKRW||0)-(st(a).evalKRW||0));
  return arr;
}

// 색: 한국식 수익=빨강 / 손실=파랑, |수익률| 클수록 진하게
function tileColor(ret){ const m=Math.min(Math.abs(ret||0),40)/40; const l=Math.round(60-m*32);
  return ret>=0 ? `hsl(2 66% ${l}%)` : `hsl(215 58% ${l}%)`; }
// 스쿼리파이드 트리맵
function squarify(items,x,y,w,h){
  const out=[]; const tot=items.reduce((s,it)=>s+it.v,0); if(tot<=0) return out;
  const scale=(w*h)/tot; let rects=items.map(it=>({...it,a:it.v*scale}));
  let rx=x,ry=y,rw=w,rh=h,idx=0;
  const worst=(row,len)=>{ const s=row.reduce((a,b)=>a+b.a,0); const mx=Math.max(...row.map(r=>r.a)),mn=Math.min(...row.map(r=>r.a)); return Math.max((len*len*mx)/(s*s),(s*s)/(len*len*mn)); };
  while(idx<rects.length){
    const len=Math.min(rw,rh); let row=[rects[idx]]; let j=idx+1;
    while(j<rects.length){ const test=row.concat([rects[j]]); if(worst(test,len)<=worst(row,len)){ row=test; j++; } else break; }
    const s=row.reduce((a,b)=>a+b.a,0);
    if(rw<=rh){ const rowH=s/rw; let cx=rx; row.forEach(r=>{ const cw=r.a/rowH; out.push({...r,x:cx,y:ry,w:cw,h:rowH}); cx+=cw; }); ry+=rowH; rh-=rowH; }
    else { const rowW=s/rh; let cy=ry; row.forEach(r=>{ const ch=r.a/rowW; out.push({...r,x:rx,y:cy,w:rowW,h:ch}); cy+=ch; }); rx+=rowW; rw-=rowW; }
    idx=j;
  }
  return out;
}
function treemapHTML(){
  const items=stocksIn().map(s=>{ const st=stockStats(s); return {s,st,v:(st.evalKRW||0),ret:(st.priceNativePct!=null?st.priceNativePct:0)}; }).filter(o=>o.v>0 && o.st.shares>0).sort((a,b)=>b.v-a.v);
  if(!items.length) return '';
  // 종목이 늘면 타일이 얇아져 글자가 잘린다 → 개수에 따라 높이를 키운다
  const W=396, H=Math.min(420, Math.max(224, 150+items.length*26)), gap=0;
  const rects=squarify(items,0,0,W,H);
  const tot=items.reduce((a,o)=>a+o.v,0);
  const cells=rects.map(r=>{ const w=r.w-gap, h=r.h-gap; if(w<=1||h<=1) return '';
    const big=w>120&&h>70, mid=w>66&&h>44;
    const tkS=big?20:(mid?14.5:11), rtS=big?13.5:(mid?11.5:10);
    const wt=(r.v/tot*100); const nm=dispTk(r.s); const tk=esc(nm.length>11?nm.slice(0,10)+'…':nm);
    let t;
    if(h<=36){
      t=`<text x="${r.x+11}" y="${r.y+h/2+3.5}" font-size="${Math.min(11,h*.42)}">${tk} · ${pctS(r.ret)}</text>`;
    } else {
      t=`<text x="${r.x+11}" y="${r.y+(big?27:22)}" font-size="${tkS}">${tk}</text>`;
      t+=`<text x="${r.x+11}" y="${r.y+(big?47:40)}" font-size="${rtS}" opacity=".95">${pctS(r.ret)}</text>`;
      if(big&&h>88) t+=`<text x="${r.x+11}" y="${r.y+h-9}" font-size="10" opacity=".8">비중 ${wt.toFixed(1)}% · ${fmtK(r.v)}</text>`;
      else if(mid&&h>74) t+=`<text x="${r.x+11}" y="${r.y+h-9}" font-size="9.5" opacity=".8">${wt.toFixed(1)}% · ${fmtK(r.v)}</text>`;
    }
    return `<g data-open="${r.s.id}"><rect x="${r.x}" y="${r.y}" width="${w}" height="${h}" rx="0" fill="${tileColor(r.ret)}"/>${t}</g>`;
  }).join('');
  return `<div class="maplbl">Market Map<span class="r">면적=비중 · 색=평가수익률(외화)</span></div>
    <svg class="tmsvg" viewBox="0 0 ${W} ${H}"><defs><clipPath id="tmclip"><rect x="0" y="0" width="${W}" height="${H}" rx="14"/></clipPath></defs><g clip-path="url(#tmclip)">${cells}</g></svg>`;
}

function viewCalendar(){
  const m=monthlyNetKRW(calYear); const counts=new Array(12).fill(0);
  const split=Array.from({length:12},()=>({usd:0,krwNative:0}));
  db.divs.forEach(d=>{ const s=stById(d.stockId); if(!s) return; if(filterAcct!=='all'&&s.accountId!==filterAcct) return;
    const dt=new Date(d.date); if(dt.getFullYear()!==calYear) return;
    const mo=dt.getMonth(); counts[mo]++;
    const net=divNet(d,s.currency);
    if(s.currency==='USD') split[mo].usd+=net; else split[mo].krwNative+=net; });
  const total=m.reduce((a,b)=>a+b,0);
  const names=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const upcoming=allPredictions().filter(p=>!p.isPast).slice(0,5);
  const upcomingHTML = upcoming.length? `<div class="sec" style="margin-top:0">🔮 다가오는 예상 배당<span class="cnt">추정치</span></div>`+
    upcoming.map(p=>{ const d=new Date(p.date+'T00:00:00');
      return `<div class="upcoming"><div class="ud">${d.getMonth()+1}월<b>${d.getDate()}</b></div>
        <div class="um"><div class="un">${esc(p.name)}</div><div class="ul">${p.freqLabel} · 주당 ${fmtCur(p.perShare,p.currency)} × ${p.shares.toLocaleString()}주</div></div>
        <div class="ur num">${fmtCur(p.net,p.currency)}</div></div>`; }).join('')
    : '';
  return upcomingHTML+`<div class="cal-year"><button id="cyPrev">‹</button><span>${calYear}년 · ${fmtK(total)}</span><button id="cyNext">›</button></div>
   <div class="calgrid">`+m.map((v,i)=>{
     const items=[];
     if(split[i].usd>0) items.push(`외화 $${split[i].usd.toFixed(2)}`);
     if(split[i].krwNative>0) items.push(`원화 ${fmtKRW(split[i].krwNative)}`);
     return `<div class="mcell${v>0?' hit':''}" data-monthopen="${i}">
       <div class="mn-row"><span class="mn">${names[i]}</span>${v>0?`<span class="ma num">${fmtK(v)}</span>`:''}</div>
       ${items.length? items.map(t=>`<div class="mitem">${t}</div>`).join('') : `<div class="ma num z">—</div>`}
       ${counts[i]?`<div class="cnt">${counts[i]}건</div>`:''}
     </div>`;
   }).join('')+'</div>';
}

function openMonthDividends(mi){
  const names=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const rows=db.divs.filter(d=>{ const s=stById(d.stockId); if(!s) return false; if(filterAcct!=='all'&&s.accountId!==filterAcct) return false;
    const dt=new Date(d.date); return dt.getFullYear()===calYear && dt.getMonth()===mi; }).sort((a,b)=>a.date.localeCompare(b.date));
  if(!rows.length){
    sheet(`<h2>${calYear}년 ${names[mi]}</h2><div class="hint">이 달엔 배당 내역이 없어요.</div>
      <div class="sheet-actions"><button class="btn ghost" id="mdh-close" style="flex:1">닫기</button></div>`);
    $('#mdh-close').onclick=close; return;
  }
  let totalKRW=0;
  const items=rows.map(d=>{
    const s=stById(d.stockId); const fx=divFxKRW(s,d); const net=divNet(d,s.currency); totalKRW+=net*fx;
    const dt=new Date(d.date);
    return `<div class="logitem"><div class="ldate">${dt.getMonth()+1}월<b>${dt.getDate()}</b>${dt.getFullYear()}</div>
      <div class="lmid"><div class="lprimary">${esc(s.name)}</div><div class="lsub2">${d.shares.toLocaleString()}주 × ${fmtCur(d.perShare,s.currency)}${d.taxFree?' · 비과세':''}</div></div>
      <div class="lamt"><div class="g num">${fmtCur(net,s.currency)}</div><div class="n num">${s.currency==='USD'?'≈ '+fmtK(net*fx):'세후'}</div></div>
    </div>`;
  }).join('');
  sheet(`<h2>${calYear}년 ${names[mi]} 배당</h2><div class="hint">${rows.length}건 · 세후 합계 ${fmtK(totalKRW)}</div>
    ${items}
    <div class="sheet-actions"><button class="btn ghost" id="mdh-close" style="flex:1">닫기</button></div>`);
  $('#mdh-close').onclick=close;
}

function viewLog(){
  const rows=db.divs.filter(d=>{ const s=stById(d.stockId); return s && (filterAcct==='all'||s.accountId===filterAcct); });
  if(!rows.length) return `<div class="empty" style="margin-top:16px"><div class="em">🌱</div><h3>배당 내역이 없어요</h3><p>종목 상세에서 배당을 기록하거나 자동 불러오기 하세요.</p></div>`;
  const byStock={};
  rows.forEach(d=>{ (byStock[d.stockId]=byStock[d.stockId]||[]).push(d); });
  const groups=Object.keys(byStock).map(sid=>{
    const s=stById(sid);
    const asc=[...byStock[sid]].sort((a,b)=>a.date.localeCompare(b.date));   // 오름차순: 전기대비 증감 계산용
    let subNet=0, subKRW=0;
    const withGrowth=asc.map((d,i)=>{
      const fx=divFxKRW(s,d); const net=divNet(d,s.currency);
      subNet+=net; subKRW+=net*fx;
      let growth=null;
      if(i>0 && asc[i-1].perShare>0) growth=(d.perShare-asc[i-1].perShare)/asc[i-1].perShare*100;
      return {...d, net, fx, growth};
    });
    withGrowth.sort((a,b)=>b.date.localeCompare(a.date));                    // 다시 최근순으로
    return {s, items:withGrowth, count:asc.length, subNet, subKRW, lastDate:withGrowth[0].date};
  }).sort((a,b)=>b.lastDate.localeCompare(a.lastDate));                      // 최근에 배당 준 종목이 위로

  return `<div class="sec">배당 수령 내역<span class="cnt">${rows.length}건 · 종목별</span></div>`+groups.map(g=>{
    const isOpen=!logCollapsed.has(g.s.id);
    const items=g.items.map(d=>{
      const dt=new Date(d.date);
      const growthBadge = d.growth==null ? `<span class="dg new">첫 지급</span>`
        : Math.abs(d.growth)<0.05 ? `<span class="dg flat">— 동일</span>`
        : d.growth>0 ? `<span class="dg up">▲ ${d.growth.toFixed(1)}%</span>`
        : `<span class="dg down">▼ ${Math.abs(d.growth).toFixed(1)}%</span>`;
      return `<div class="drow"><div class="dd">${String(dt.getFullYear()).slice(2)}.${String(dt.getMonth()+1).padStart(2,'0')}.${String(dt.getDate()).padStart(2,'0')}</div>
        <div class="dm">${d.shares.toLocaleString()}주 × ${fmtCur(d.perShare,g.s.currency)} ${growthBadge}${d.locked?' <span class="dg" style="background:var(--bg);color:var(--ink2)">🔒</span>':''}${d.taxFree?' <span class="dg flat">비과세</span>':''}</div>
        <div class="da num">${fmtCur(d.net,g.s.currency)}${g.s.currency==='USD'?`<span class="won">≈${fmtK(d.net*d.fx)}</span>`:''}</div>
        <button class="edit" data-editdivlog="${g.s.id}|${d.id}"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
        <button class="del" data-deldiv="${d.id}"><svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button></div>`;
    }).join('');
    return `<div class="logGroup">
      <div class="logGroupHead" data-loggrouptog="${g.s.id}"><div class="tick" style="width:34px;height:34px;border-radius:10px;font-size:10px">${initials(g.s.ticker||g.s.name)}${logoImg(g.s)}</div>
        <div class="mid"><div class="nm">${esc(g.s.name)}</div><div class="sub">${g.count}건 누적 · 세후</div></div>
        <div class="rt"><div class="amt num">${fmtCur(g.subNet,g.s.currency)}</div>${g.s.currency==='USD'?`<div class="sub2 num">≈ ${fmtK(g.subKRW)}</div>`:''}</div>
        <div class="logArrow ${isOpen?'open':''}"><svg viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
      ${isOpen?items:''}
    </div>`;
  }).join('');
}

function sheetScrollY(){ const el=scrim.querySelector('.sheet'); return el?el.scrollTop:0; }
function restoreSheetScroll(y){ if(!y) return;
  // 시트를 다시 열면 레이아웃·전환 애니메이션이 스크롤을 0으로 되돌린다 → 몇 프레임에 걸쳐 다시 잡아준다
  const put=()=>{ const el=scrim.querySelector('.sheet'); if(el && Math.abs(el.scrollTop-y)>1) el.scrollTop=y; };
  requestAnimationFrame(()=>{ put(); requestAnimationFrame(put); });
  [40,120,260].forEach(ms=>setTimeout(put,ms)); }
function backToDetail(stockId){ const y=sheetScrollY();
  return ()=>{ openStockDetail(stockId); restoreSheetScroll(y); }; }
function sheet(html){
  const wasOpen=scrim.classList.contains('on');
  scrim.innerHTML='<div class="sheet"><div class="grab"></div>'+html+'</div>'; scrim.classList.add('on'); document.body.style.overflow='hidden'; scrim.onclick=e=>{if(e.target===scrim)close();};
  // 시트가 새로 열릴 때만 히스토리 1칸 추가 → 안드로이드 뒤로가기가 시트를 닫는다
  if(!wasOpen){ _sheetOpen=true; try{ history.pushState({tmt:'sheet'},''); }catch(e){} }
}
function close(){
  // 이전 화면이 지정돼 있으면 완전히 닫지 않고 그 화면으로 되돌아간다
  if(_sheetReturn){ const f=_sheetReturn; _sheetReturn=null; f();
    if(_fromPop){ try{ history.pushState({tmt:'sheet'},''); }catch(e){} }
    return; }
  scrim.classList.remove('on'); scrim.innerHTML=''; document.body.style.overflow='';
  if(_sheetOpen){ _sheetOpen=false; if(!_fromPop){ try{ history.back(); }catch(e){} } }
}

/* ---------- search ---------- */
let _searchTimer=null;
function normQ(s){ return (s||'').normalize('NFKC').replace(/[\u200B-\u200D\uFEFF\u00AD]/g,'').replace(/\s+/g,' ').trim(); }
function attachSearch(inp, drop, onPick){
  const fire=()=>{
    const q=normQ(inp.value); clearTimeout(_searchTimer);
    if(q.length<1){ drop.classList.remove('on'); drop.innerHTML=''; return; }
    if(!backendBase()){ drop.innerHTML='<div class="search-hint">설정에서 백엔드 주소를 먼저 등록하세요</div>'; drop.classList.add('on'); return; }
    drop.classList.add('on'); _searchTimer=setTimeout(()=>doSearch(q,0),300);
  };
  inp.addEventListener('input',fire);
  inp.addEventListener('compositionend',fire);   // 삼성 키보드 조합 확정 시 재검색
  async function doSearch(q,attempt){
    if(normQ(inp.value)!==q) return;
    drop.innerHTML = attempt===0?'<div class="search-hint">검색 중…</div>':'<div class="search-hint">서버 깨우는 중… 잠시만요</div>';
    const res=await apiGet('/search?q='+encodeURIComponent(q.toLowerCase())+'&market=all');
    if(normQ(inp.value)!==q) return;
    if(!res){ if(attempt<2){ drop.innerHTML='<div class="search-hint">서버 깨우는 중… 재시도 ('+(attempt+1)+'/2)</div>'; setTimeout(()=>doSearch(q,attempt+1),2500); return; } drop.innerHTML='<div class="search-hint">검색 실패 · 잠시 후 다시</div>'; return; }
    if(!res.length){ drop.innerHTML='<div class="search-hint">결과 없음 (영문명·티커로도)</div>'; return; }
    drop.innerHTML=res.slice(0,20).map((r,i)=>`<div class="search-item" data-i="${i}"><div class="si-tick">${esc(r.ticker)}</div><div class="si-name">${esc(r.name)}</div><div class="si-mk">${esc(r.market)}</div></div>`).join('');
    drop.querySelectorAll('.search-item').forEach(el=>el.onclick=()=>{ onPick(res[+el.dataset.i]); drop.classList.remove('on'); });
  }
}

/* ---------- FX auto ---------- */
async function fetchFx(date){ if(!date) return null; const r=await apiGet('/fxrate?date='+date.replace(/-/g,'')); return (r&&r.rate)?r.rate:null; }
function wireFx(dateInp, fxInp, note){
  let edited=false; fxInp.addEventListener('input',()=>{ edited=true; });
  const upd=async()=>{ if(edited) return; note.innerHTML='환율 불러오는 중…';
    const rate=await fetchFx(dateInp.value);
    if(rate){ if(!edited) fxInp.value=rate; note.innerHTML=`매입일 환율 <b>${rate}</b> 자동 · 실제 체결환율로 수정 가능`; }
    else note.innerHTML='환율 자동조회 실패 · 직접 입력'; };
  dateInp.addEventListener('change',upd); upd();
}
