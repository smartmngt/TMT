/* ---------- 배당 추이 차트 (야후 파이낸스 공식 배당이력 기준) ---------- */
let dchYears=5;                               // 5 · 10 · 20년 (야후 이력 조회 구간)
let dchMode='yf';                                    // 'yf' 야후 주당배당(세전) · 'my' 내 실수령(세후)
let _dchBusy={};
let divHist=(()=>{ try{ return JSON.parse(localStorage.getItem('tmt.divhist'))||{}; }catch(e){ return {}; } })();
function saveDivHist(){ try{ localStorage.setItem('tmt.divhist', JSON.stringify(divHist)); }catch(e){} }
// 야후 배당이력 — 티커 단위로 24시간 캐시. 실패해도 캐시가 있으면 그대로 쓴다.
async function fetchDivHist(s, force){
  if(!s || !s.ticker || !backendBase()) return false;
  const key=s.ticker+'|'+dchYears;
  const c=divHist[key];
  if(!force && c && c.items && (Date.now()-c.ts)<864e5) return false;
  if(_dchBusy[key]) return false;
  _dchBusy[key]=true;
  try{
    // 백엔드 market이 비어 있으면 국내(.KS)로 간주되므로, 달러 종목은 'US'로 채워 보낸다
    const mk=s.market || (s.currency==='USD'?'US':'');
    const r=await apiGet('/dividends?ticker='+encodeURIComponent(s.ticker)+'&market='+encodeURIComponent(mk)+'&years='+dchYears);
    if(r && Array.isArray(r.dividends)){
      const items=r.dividends.filter(x=>x && x.date && +x.perShare>0)
                             .map(x=>({date:String(x.date).slice(0,10), amt:+x.perShare}))
                             .sort((a,b)=>a.date.localeCompare(b.date));
      divHist[key]={ts:Date.now(), items, symbol:r.symbol||s.ticker};
      saveDivHist(); return true;
    }
    if(c) { c.ts=Date.now()-8.5e7; return false; }     // 실패 → 30분 뒤 재시도 허용
    divHist[key]={ts:Date.now()-8.5e7, items:[], err:true}; return true;
  }catch(e){ return false; }
  finally{ _dchBusy[key]=false; }
}
// 배당락일 → 지급월 보정.
// 야후가 주는 날짜는 지급일이 아니라 '배당락일'이다. O처럼 월말(또는 1일)에 락이 걸리는 종목은
// 4월 30일 락 → 5월 15일 지급이라, 그대로 달에 담으면 5월이 비고 다른 달에 두 건이 겹친다.
// 월말 4일 이내에 걸린 배당은 다음 달 몫으로 옮긴다. (지급일이 중순인 수기 입력분은 영향 없음)
function payMonthKey(iso){
  const y=+iso.slice(0,4), m=+iso.slice(5,7)-1, d=+iso.slice(8,10);
  const dim=new Date(y, m+1, 0).getDate();
  return ((dim-d)<=4) ? (y*12+m+1) : (y*12+m);
}
// 차트·성장률의 공통 입력: {date, mk, dps, amt, shares}
function dchEvents(id, mode){
  const s=stById(id); if(!s) return null;
  if(mode==='yf'){
    const c=divHist[s.ticker+'|'+dchYears];
    if(!c || !c.items || !c.items.length) return null;
    return c.items.map(x=>({date:x.date, mk:payMonthKey(x.date), dps:x.amt, amt:0, shares:0}));
  }
  return divsOf(id).filter(d=>d.shares>0).map(d=>{ const net=divNet(d,s.currency);
    return {date:d.date, mk:payMonthKey(d.date), dps:net/d.shares, amt:net, shares:d.shares}; })
    .sort((a,b)=>a.date.localeCompare(b.date));
}
function dchSeries(ev){
  if(!ev || !ev.length) return null;
  const endT=now.getFullYear()*12+now.getMonth();
  const firstT=Math.min(...ev.map(e=>e.mk));
  const n=Math.max(1, Math.min(endT-firstT+1, dchYears*12));
  const base=endT-(n-1);
  const keys=[],dps=[],amt=[],shr=[],cnt=[],dts=[];
  for(let i=0;i<n;i++){ const t=base+i; keys.push({y:Math.floor(t/12), m:t%12}); dps.push(0); amt.push(0); shr.push(0); cnt.push(0); dts.push([]); }
  ev.forEach(e=>{ const i=e.mk-base; if(i<0||i>=n) return;
    dps[i]+=e.dps; amt[i]+=e.amt; shr[i]+=e.shares; cnt[i]++; dts[i].push(e.date); });
  return {keys,dps,amt,shr,cnt,dts,n,truncated:(endT-firstT+1)>n};
}
function dchGrowth(ev){    // 주당배당 기준(주수 변동 무관) · 지급월 기준(배당락 쏠림 무관)
  if(!ev || !ev.length) return null;
  const cmk=now.getFullYear()*12+now.getMonth();
  const dpsIn=(from,to)=>ev.reduce((a,e)=>(e.mk>from&&e.mk<=to)?a+e.dps:a,0);
  const cur=dpsIn(cmk-12,cmk), prev=dpsIn(cmk-24,cmk-12);   // 직전 12개월 vs 그 이전 12개월
  const yoy = prev>0 ? (cur-prev)/prev*100 : null;
  const byY={}; ev.forEach(e=>{ const y=Math.floor(e.mk/12); byY[y]=(byY[y]||0)+e.dps; });
  const firstY=Math.floor(Math.min(...ev.map(e=>e.mk))/12), nowY=now.getFullYear();
  const full=Object.keys(byY).map(Number).filter(y=>y>firstY&&y<nowY).sort((a,b)=>a-b);   // 온전한 해만
  let cagr=null,span=null;
  if(full.length>=2){ const a=byY[full[0]], b=byY[full[full.length-1]], k=full.length-1;
    if(a>0&&b>0){ cagr=(Math.pow(b/a,1/k)-1)*100; span=full[0]+'\u2192'+full[full.length-1]; } }
  return {cur,prev,yoy,cagr,span,byY,full,firstY,nowY};
}
function dchHTML(id){
  const s=stById(id); if(!s) return '';
  const hist=divHist[s.ticker+'|'+dchYears];
  const hasYF=!!(hist && hist.items && hist.items.length);
  const mode=(dchMode==='yf'&&!hasYF)?'my':dchMode;
  const ev=dchEvents(id,mode), sr=dchSeries(ev), g=dchGrowth(ev);
  const tabs=`<div class="dch-tabs"><button data-dch="yf" class="${mode==='yf'?'on':''}">주당배당 · 야후</button><button data-dch="my" class="${mode==='my'?'on':''}">내 실수령</button></div>`;
  const yrChip0=`<div class="dch-yrs">${[5,10,20].map(y=>`<button data-dchy="${y}" class="${dchYears===y?'on':''}">${y}년</button>`).join('')}</div>`;
  if(!sr) return tabs+yrChip0+`<div class="dch-note">${mode==='yf'
      ? (backendBase()? (_dchBusy[s.ticker]?'야후에서 배당이력을 가져오는 중입니다…':'야후에 이 종목의 배당이력이 없거나 조회에 실패했습니다. 우측 위 ↻ 를 눌러 다시 시도해 보세요.')
                      : '설정에서 백엔드 주소를 먼저 등록하세요.')
      : '배당 기록이 쌓이면 월별 추이가 여기에 표시됩니다.'}</div>`;
  const isMy=mode==='my';
  const cur=s.currency;
  const v=isMy?sr.amt:sr.dps, n=sr.n, max=Math.max(...v,1e-9);
  const W=340,H=92,PB=13, bw=W/n, bar=Math.max(1.6,bw*0.66), y0=H-PB;
  const bars=v.map((x,i)=>{ const h=x>0?Math.max(2,(x/max)*(y0-6)):0;
    return `<rect class="bar" data-i="${i}" x="${(i*bw+(bw-bar)/2).toFixed(2)}" y="${(y0-h).toFixed(2)}" width="${bar.toFixed(2)}" height="${h.toFixed(2)}" rx="${Math.min(1.6,bar/2).toFixed(2)}" fill="${x>0?'var(--green)':'transparent'}" opacity="${x>0?.85:0}"/>`; }).join('');
  // 막대 폭이 5년치면 3px 남짓이라 손가락으로 못 짚는다 → 칸 전체를 덮는 투명 터치영역을 따로 깐다
  const hits=v.map((x,i)=>`<rect class="hit" data-i="${i}" x="${(i*bw).toFixed(2)}" y="0" width="${bw.toFixed(2)}" height="${y0}" fill="transparent"/>`).join('')
    + `<line class="dch-cur" x1="0" y1="2" x2="0" y2="${y0}" stroke="var(--ink2)" stroke-width="1" opacity="0"/>`;
  let line='';
  if(n>=13){ const pts=[];
    for(let i=11;i<n;i++){ let sum=0; for(let k=i-11;k<=i;k++) sum+=v[k];
      pts.push(`${(i*bw+bw/2).toFixed(2)},${(y0-(sum/12/max)*(y0-6)).toFixed(2)}`); }
    line=`<polyline points="${pts.join(' ')}" fill="none" stroke="var(--gold)" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>`; }
  let yrs='';
  sr.keys.forEach((k,i)=>{ if(k.m!==0&&i!==0) return; const x=i*bw;
    if(i!==0) yrs+=`<line x1="${x.toFixed(2)}" y1="4" x2="${x.toFixed(2)}" y2="${y0}" stroke="var(--line)" stroke-width="1"/>`;
    yrs+=`<text x="${(x+2).toFixed(2)}" y="${H-3}" font-size="9.5" font-weight="700" fill="var(--muted)">${k.y}</text>`; });
  const gv=x=>x==null?'\u2014':((x>=0?'+':'')+x.toFixed(1)+'%');
  const gc=x=>x==null?'var(--muted)':(x>=0?'var(--green)':'var(--red)');
  const yrRow=g.full.concat(g.byY[g.nowY]!=null?[g.nowY]:[]).map(y=>`${y} <b>${fmtCur(g.byY[y],cur)}${y===g.nowY?'*':''}</b>`).join(' · ');
  const basis=isMy?'세후 · 내 보유분':'세전 · 주당';

function bindDch(id){
  const wrap=document.getElementById('dchWrap'); if(!wrap) return;
  const s=stById(id);
  wrap.querySelectorAll('[data-dch]').forEach(b=>b.onclick=()=>{ dchMode=b.dataset.dch; wrap.innerHTML=dchHTML(id); bindDch(id); });
  wrap.querySelectorAll('[data-dchy]').forEach(b=>b.onclick=()=>{ dchYears=+b.dataset.dchy;
    wrap.innerHTML=dchHTML(id); bindDch(id); refreshDch(id,false); });
  const _h=divHist[s.ticker+'|'+dchYears];
  const mode=(dchMode==='yf'&&!(_h&&_h.items&&_h.items.length))?'my':dchMode;
  const sr=dchSeries(dchEvents(id,mode)); const cap=document.getElementById('dchCap');
  if(!sr||!cap) return;
  const bars=[...wrap.querySelectorAll('rect.bar')];
  const svg=wrap.querySelector('svg.dchsvg');
  const guide=wrap.querySelector('line.dch-cur');
  const base=cap.innerHTML;
  const n=sr.n;
  let sel=-1;
  const clear=()=>{ sel=-1; cap.innerHTML=base;
    bars.forEach(b=>b.setAttribute('opacity', (+b.getAttribute('height')>0)?'.85':'0'));
    if(guide) guide.setAttribute('opacity','0'); };
  const pick=i=>{
    if(i<0||i>=n||i===sel) return;
    sel=i;
    bars.forEach((b,bi)=>{ const on=+b.getAttribute('height')>0; b.setAttribute('opacity', on?(bi===i?'1':'.3'):'0'); });
    if(guide){ const cx=(i+0.5)*(340/n); guide.setAttribute('x1',cx); guide.setAttribute('x2',cx); guide.setAttribute('opacity','.28'); }
    const k=sr.keys[i], mm=`${k.y}.${String(k.m+1).padStart(2,'0')}`;
    const val=mode==='my'?sr.amt[i]:sr.dps[i];
    if(!(val>0)){ cap.innerHTML=`<b>${mm}</b> · 배당 없음`; return; }
    const ex=(sr.dts[i]||[]).join(', ');
    cap.innerHTML=(mode==='my'
      ? `<b>${mm}</b> · <b style="color:var(--green)">${fmtCur(sr.amt[i],s.currency)}</b> 수령${sr.shr[i]>0?` · ${sr.shr[i].toLocaleString()}주 × ${fmtCur(sr.dps[i],s.currency)}`:''}`
      : `<b>${mm}</b> · 주당 <b style="color:var(--green)">${fmtCur(sr.dps[i],s.currency)}</b> · 세전`)
      + (ex?`<br><span style="opacity:.6">${mode==='my'?'기록일':'배당락'} ${ex}${sr.cnt[i]>1?` · ${sr.cnt[i]}건`:''}</span>`:'');
  };
  // 손가락을 대고 좌우로 밀면 그 위치의 달이 따라온다. 뗀 자리에서 값이 남는다.
  if(svg){
    const idxAt=clientX=>{ const r=svg.getBoundingClientRect();
      if(!r.width) return -1;
      return Math.max(0, Math.min(n-1, Math.floor((clientX-r.left)/r.width*n))); };
    let down=false, moved=false, startX=0, startSel=-1;
    svg.onpointerdown=e=>{ down=true; moved=false; startX=e.clientX; startSel=sel;
      try{ svg.setPointerCapture(e.pointerId); }catch(_){}
      pick(idxAt(e.clientX)); };
    svg.onpointermove=e=>{ if(!down) return;
      if(Math.abs(e.clientX-startX)>3) moved=true;
      pick(idxAt(e.clientX)); };
    const end=e=>{ if(!down) return; down=false;
      try{ svg.releasePointerCapture(e.pointerId); }catch(_){}
      // 움직이지 않고 이미 선택돼 있던 막대를 다시 눌렀으면 해제
      if(!moved && startSel===sel) clear(); };
    svg.onpointerup=end; svg.onpointercancel=end;
  }
}

    <button class="btn ghost" id="d-autodiv" style="width:100%;margin-bottom:8px;padding:12px">📥 배당 자동 불러오기 (공개 배당이력)</button>
    ${(()=>{ const gaps=ds.map(d=>({d,g:divShareGap(id,d)})).filter(x=>x.g);
      if(!gaps.length) return '';
      const li=gaps.slice(0,4).map(x=>`${fmtDateS(x.d.date)} ${fmtNumS(x.g.have)}주 → ${fmtNumS(x.g.want)}주 (락일 ${fmtDateS(x.d.srcDate)} 전날 기준)`).join(' · ');

    <div class="foldsec" data-fold="dv"><span class="flbl">배당 내역</span><svg class="fchev" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="fsum num">${dItems.length?`${dItems.length}건 · ${fmtCur(divSumN,s.currency)} · ${fmtK(divSumK)}`:'없음'}</span></div>
    <div data-foldbody="dv"><div class="setcard" style="padding:2px 16px">${divRows}</div></div>
    <div class="sheet-actions"><button class="btn ghost" id="d-del">종목 삭제</button><button class="btn ghost" id="d-close" style="flex:1">닫기</button></div>`);
  // 접기·펼치기 (재렌더 없이 DOM 토글 → 스크롤 위치 유지)
  const applyFold=()=>{

  };
  scrim.querySelectorAll('[data-fold]').forEach(h=>h.onclick=()=>{ const k=h.dataset.fold; foldState[k]=!foldState[k]; applyFold(); });
  applyFold();

  bindDch(id);
  refreshDch(id,false);
  $('#dchRef').onclick=()=>{ toast('야후 배당이력 갱신 중…'); refreshDch(id,true); };
  $('#d-addbuy').onclick=()=>openBuy(id);
  $('#d-addsell').onclick=()=>openSell(id);
  $('#d-adddiv').onclick=()=>openDiv(id);
  $('#d-autodiv').onclick=()=>autoDividends(id);
  { const b=$('#d-fixsh'); if(b) b.onclick=()=>{ const n=fixDivShares(id);
      toast(n?`${n}건 주수 갱신됨`:'맞출 항목이 없어요'); render();
      const _y=sheetScrollY(); openStockDetail(id); restoreSheetScroll(_y); }; }
  $('#d-split').onclick=()=>openSplit(id);
  { const q=$('#d-qdate'); if(q) q.onclick=async()=>{ toast('시세 다시 받는 중…'); await loadLive(true);
      const _y=sheetScrollY(); openStockDetail(id); restoreSheetScroll(_y); }; }
  $('#d-close').onclick=close;
  $('#d-del').onclick=()=>{ const n=bs.length+sl.length+ds.length; if(confirm(`'${s.name}' 종목을 삭제할까요?${n?`\n거래·배당 ${n}건도 함께 삭제됩니다.`:''}`)){ db.stocks=db.stocks.filter(x=>x.id!==id); db.buys=db.buys.filter(b=>b.stockId!==id); db.sells=db.sells.filter(b=>b.stockId!==id); db.divs=db.divs.filter(d=>d.stockId!==id); delete priceCache[id]; save(); _sheetReturn=null; close(); render(); toast('삭제됨'); } };
  scrim.querySelectorAll('[data-editbuy]').forEach(b=>b.onclick=()=>openBuy(id, b.dataset.editbuy));
  scrim.querySelectorAll('[data-editsell]').forEach(b=>b.onclick=()=>openSell(id, b.dataset.editsell));
  scrim.querySelectorAll('[data-editdiv]').forEach(b=>b.onclick=()=>openDiv(id, b.dataset.editdiv));
  scrim.querySelectorAll('[data-delbuy]').forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation(); if(confirm('이 매수를 삭제할까요?')){ db.buys=db.buys.filter(x=>x.id!==b.dataset.delbuy); const _y=sheetScrollY(); save(); openStockDetail(id); restoreSheetScroll(_y); render(); } });
  scrim.querySelectorAll('[data-delsell]').forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation(); if(confirm('이 매도를 삭제할까요?')){ db.sells=db.sells.filter(x=>x.id!==b.dataset.delsell); const _y=sheetScrollY(); save(); openStockDetail(id); restoreSheetScroll(_y); render(); } });
  scrim.querySelectorAll('[data-deldiv2]').forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation(); if(confirm('이 배당을 삭제할까요?')){ db.divs=db.divs.filter(x=>x.id!==b.dataset.deldiv2); const _y=sheetScrollY(); save(); openStockDetail(id); restoreSheetScroll(_y); render(); } });
}

/* ---------- buy ---------- */
function openBuy(stockId, editId){
  const _back=backToDetail(stockId);
  if(scrim.classList.contains('on')) _sheetReturn=_back;
  const s=stById(stockId);
  const editing = editId ? db.buys.find(b=>b.id===editId) : null;
  sheet(`<h2>${editing?'매수 수정':'매수 기록'} · ${esc(s.name)}</h2><div class="hint">${editing?'값을 고치고 저장하세요.':'날짜를 넣으면 그날 환율이 자동 입력돼요.'}</div>
    <div class="row2"><div class="field"><label>매수일</label><input id="b-date" type="date" value="${editing?editing.date:todayISO()}"></div><div class="field"><label>수량</label><input id="b-shares" type="number" inputmode="decimal" step="any" placeholder="0" value="${editing?editing.shares:''}"></div></div>
    <div class="row2"><div class="field"><label>매수 단가 (${s.currency})</label><input id="b-price" type="number" inputmode="decimal" step="any" placeholder="0" value="${editing?editing.price:''}"></div>
      <div class="field"><label>수수료 (${s.currency})</label><input id="b-fee" type="number" inputmode="decimal" step="any" placeholder="0" value="${editing&&editing.fee?editing.fee:''}"></div></div>
    <div class="fx-note" id="b-feenote">수수료는 통장에서 매수금액과 합쳐 출금으로 빠져요 · 평단·매수원가는 체결가 기준</div>
    ${s.currency==='USD'?`<div class="field"><label>매입 환율 (USD→KRW)</label><input id="b-fx" type="number" inputmode="decimal" step="any" placeholder="자동" value="${editing?fxV(editing):''}"></div><div class="fx-note" id="b-fxnote"></div>`:''}
    <div class="field"><label>자금 출처</label>
      <div class="seg-in" id="b-src"><button type="button" data-src="auto">⚙️ 자동</button><button type="button" data-src="new">💵 신규</button><button type="button" data-src="reinvest">🌾 재투자</button></div>
      <div style="font-size:11px;color:var(--muted);font-weight:600;margin-top:6px" id="b-srcnote"></div></div>
    <div class="sheet-actions">${editing?'<button class="btn ghost" id="b-del" style="color:var(--red)">삭제</button>':''}<button class="btn ghost" id="b-cancel">취소</button><button class="btn" id="b-save">${editing?'저장':'추가'}</button></div>`);
  { const c=$('#b-cancel'); if(c) c.onclick=()=>close(); }
  if(s.currency==='USD'){ const fxi=$('#b-fx'), noteEl=$('#b-fxnote');
    if(editing){ noteEl.innerHTML='기존 환율 유지 중 · 필요하면 직접 수정'; }
    else{ wireFx($('#b-date'),fxi,noteEl); } }
  let src = editing ? ((editing.src==='new'||editing.src==='reinvest')?editing.src:'auto') : 'auto';
  const srcNote=$('#b-srcnote');
  const paintSrc=()=>{ $('#b-src').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.src===src));
    if(src==='auto'){
      const r=editing?reinvMap().get(editing.id):null;
      srcNote.innerHTML = r&&r.krw>0
        ? `쌓인 배당에서 <b style="color:var(--green)">${fmtK(r.krw)}</b> 사용된 것으로 잡혔어요 · 나머지는 신규 투입`
        : '매수 시점에 쌓인 배당을 먼저 쓴 것으로 계산해요 · 배당 잔고가 없으면 전액 신규 투입';
    } else if(src==='reinvest') srcNote.innerHTML='전액 배당으로 매수한 것으로 고정 · 외부원금엔 안 더해져 <b style="color:var(--green)">복리로 집계</b>';
    else srcNote.innerHTML='전액 내 주머니에서 넣은 돈으로 고정 · 외부원금·수익률 계산 기준'; };
  $('#b-src').querySelectorAll('button').forEach(x=>x.onclick=()=>{ src=x.dataset.src; paintSrc(); });
  paintSrc();
  $('#b-save').onclick=()=>{ const shares=parseFloat($('#b-shares').value), price=parseFloat($('#b-price').value), date=$('#b-date').value;
    const fee=Math.max(0, parseFloat($('#b-fee').value)||0);
    if(!(shares>0)) return toast('수량을 확인하세요'); if(!(price>0)) return toast('단가를 확인하세요'); if(!date) return toast('매수일을 선택하세요');
    let fx=1; if(s.currency==='USD'){ fx=parseFloat($('#b-fx').value); if(!(fx>0)) return toast('환율을 확인하세요'); }
    if(editing){ Object.assign(editing,{date,shares,price,fx,fee,src: src==='auto'?null:src}); save(); render(); toast('매수 수정됨'); _sheetReturn=_back; close(); }
    else{ db.buys.push({ id:uid(), stockId, date, shares, price, fx, fee, src: src==='auto'?null:src }); save(); render(); toast('매수 기록됨'); _sheetReturn=_back; close(); } };
  if(editing){ const db_=$('#b-del'); if(db_) db_.onclick=()=>{ if(confirm('이 매수를 삭제할까요?')){ db.buys=db.buys.filter(x=>x.id!==editing.id); save(); render(); toast('삭제됨'); _sheetReturn=_back; close(); } }; }
}

/* ---------- sell ---------- */
function openSell(stockId, editId){
  const _back=backToDetail(stockId);
  if(scrim.classList.contains('on')) _sheetReturn=_back;
  const s=stById(stockId); const held=stockStats(s).shares;
  const editing = editId ? db.sells.find(x=>x.id===editId) : null;
  const heldForEdit = editing ? held+editing.shares : held; // 수정 중인 수량은 보유수량에 되돌려 계산
  sheet(`<h2>${editing?'매도 수정':'매도 기록'} · ${esc(s.name)}</h2><div class="hint">현재 보유 ${heldForEdit.toLocaleString()}주. 매도하면 보유수량이 줄고 실현손익이 계산돼요.</div>
    <div class="row2"><div class="field"><label>매도일</label><input id="x-date" type="date" value="${editing?editing.date:todayISO()}"></div><div class="field"><label>수량</label><input id="x-shares" type="number" inputmode="decimal" step="any" placeholder="0" max="${heldForEdit}" value="${editing?editing.shares:''}"></div></div>
    <div class="row2"><div class="field"><label>매도 단가 (${s.currency})</label><input id="x-price" type="number" inputmode="decimal" step="any" placeholder="0" value="${editing?editing.price:''}"></div>
      <div class="field"><label>수수료·세금 (${s.currency})</label><input id="x-fee" type="number" inputmode="decimal" step="any" placeholder="0" value="${editing&&editing.fee?editing.fee:''}"></div></div>
    <div class="fx-note">수수료·거래세는 통장 입금액에서 차감돼요 · 실현손익은 체결가 기준</div>
    ${s.currency==='USD'?`<div class="field"><label>매도 환율 (USD→KRW)</label><input id="x-fx" type="number" inputmode="decimal" step="any" placeholder="자동" value="${editing?fxV(editing):''}"></div><div class="fx-note" id="x-fxnote"></div>`:''}
    <div class="calc-preview" id="x-prev"></div>
    <div class="sheet-actions">${editing?'<button class="btn ghost" id="x-del" style="color:var(--red)">삭제</button>':''}<button class="btn ghost" id="x-cancel">취소</button><button class="btn" id="x-save" style="background:var(--red)">${editing?'저장':'매도 기록'}</button></div>`);
  { const c=$('#x-cancel'); if(c) c.onclick=()=>close(); }
  if(s.currency==='USD'){ const fxi=$('#x-fx'), noteEl=$('#x-fxnote');
    if(editing){ noteEl.innerHTML='기존 환율 유지 중 · 필요하면 직접 수정'; }
    else{ wireFx($('#x-date'),fxi,noteEl); } }
  const avg=stockStats(s).avgPrice;
  function calc(){ const sh=parseFloat($('#x-shares').value)||0, pr=parseFloat($('#x-price').value)||0; const prev=$('#x-prev');
    if(sh>0&&pr>0){ const rn=sh*(pr-avg); prev.classList.add('on'); prev.style.color=rn>=0?'var(--green)':'var(--red)'; prev.style.background=rn>=0?'var(--green-t)':'var(--red-t)';
      prev.innerHTML=`실현손익 <b>${rn>0?'+':''}${fmtCur(rn,s.currency)}</b> <span style="opacity:.7">(평단 ${fmtCur(avg,s.currency)} 대비)</span>`; } else prev.classList.remove('on'); }
  $('#x-shares').oninput=calc; $('#x-price').oninput=calc; calc();
  $('#x-save').onclick=()=>{ const shares=parseFloat($('#x-shares').value), price=parseFloat($('#x-price').value), date=$('#x-date').value;
    const fee=Math.max(0, parseFloat($('#x-fee').value)||0);
    if(!(shares>0)) return toast('수량을 확인하세요'); if(shares>heldForEdit) return toast(`보유수량(${heldForEdit})을 초과했어요`); if(!(price>0)) return toast('단가를 확인하세요'); if(!date) return toast('매도일을 선택하세요');
    let fx=1; if(s.currency==='USD'){ fx=parseFloat($('#x-fx').value); if(!(fx>0)) return toast('환율을 확인하세요'); }
    if(editing){ Object.assign(editing,{date,shares,price,fx,fee}); save(); render(); toast('매도 수정됨'); _sheetReturn=_back; close(); }
    else{ db.sells.push({ id:uid(), stockId, date, shares, price, fx, fee }); save(); render(); toast('매도 기록됨'); _sheetReturn=_back; close(); } };
  if(editing){ const db_=$('#x-del'); if(db_) db_.onclick=()=>{ if(confirm('이 매도를 삭제할까요?')){ db.sells=db.sells.filter(x=>x.id!==editing.id); save(); render(); toast('삭제됨'); _sheetReturn=_back; close(); } }; }
}

      <button id="v-lock" type="button" class="sbtn" style="white-space:nowrap">🔒 확정</button><!--라벨은 paintLock이 상태에 맞춰 바꾼다-->
      <div style="font-size:11px;color:var(--muted);font-weight:600" id="v-locknote">확정하면 '배당 자동 불러오기'를 다시 해도 이 항목은 안 바뀜</div></div></div>
    <div class="sheet-actions">${editing?'<button class="btn ghost" id="v-del" style="color:var(--red)">삭제</button>':''}<button class="btn ghost" id="v-cancel">취소</button><button class="btn" id="v-save">${editing?'저장':'기록'}</button></div>`);
  { const c=$('#v-cancel'); if(c) c.onclick=()=>close(); }
  const dateInp=$('#v-date'), shInp=$('#v-shares'), perInp=$('#v-per'), taxInp=$('#v-tax'), tfBtn=$('#v-taxfree'), netInp=$('#v-net');
  let taxFree = editing ? !!editing.taxFree : false;
  let locked = editing ? !!editing.locked : false;
  // 자동 불러오기가 이 항목을 다시 찾을 때 쓰는 '원본 지급일'(미국 기준).
  // 사용자가 실입금일로 날짜를 바꿔도 이 값은 고정 → 중복 생성 방지.
  const srcDate = editing ? (editing.srcDate || editing.date) : null;
  // 지급일 환율을 화면 없이 백그라운드로 자동 조회·보관 (배당 환차 계산용)
  let payFx = editing ? fxV(editing) : (fxNow||null);
  const fetchPayFx=async()=>{ if(s.currency!=='USD') return; const r=await fetchFx(dateInp.value); if(r) payFx=r; };
  dateInp.addEventListener('change',fetchPayFx); if(!editing) fetchPayFx();
  const srcNote=$('#v-srcnote');
  const paintSrc=()=>{ if(!srcNote) return;
    if(srcDate){ srcNote.style.display='block';
      const baseD=addDaysISO(srcDate,-1), holdN=sharesAsOf(stockId,baseD);
      srcNote.innerHTML=`야후 배당락일 <b>${srcDate}</b>${dateInp.value!==srcDate?` · 지급일 <b>${dateInp.value}</b>로 기록됨`:' · 지급일은 실제 입금일로 고치셔도 돼요'}`
        + `<br>대상주수는 <b>락일 전날(${baseD})</b>까지 매수분 = <b>${fmtNumS(holdN)}주</b> · 락일 당일 매수는 제외`; }
    else srcNote.style.display='none'; };
  dateInp.addEventListener('change',paintSrc); paintSrc();
  const lockBtn=$('#v-lock'), lockNote=$('#v-locknote');
  const paintLock=()=>{ lockBtn.style.background=locked?'var(--navy)':''; lockBtn.style.color=locked?'#fff':'';
    lockBtn.textContent = locked ? '🔓 확정 해제' : '🔒 확정';        // 한 번 더 누르면 풀린다는 걸 라벨로 보여준다
    lockNote.innerHTML = locked ? '<b style="color:var(--green)">확정됨</b> · 주당배당·날짜를 야후가 못 건드림 · 보유주수는 매수 기록에 맞춰 갱신됨 · 한 번 더 누르면 해제' : "확정하면 '배당 자동 불러오기'를 다시 해도 주당배당·날짜가 안 바뀜"; };
  lockBtn.onclick=()=>{ locked=!locked; paintLock(); toast(locked?'확정 🔒':'확정 해제 🔓'); };
  paintLock();
  if(taxFree){ tfBtn.style.background='var(--green)'; tfBtn.style.color='#fff'; taxInp.disabled=true; }
  if(editing) shInp.dataset.edited='1'; // 수정 모드에선 날짜 바뀌어도 수량 자동재계산 안 함
  tfBtn.onclick=()=>{ taxFree=!taxFree; tfBtn.style.background=taxFree?'var(--green)':''; tfBtn.style.color=taxFree?'#fff':''; taxInp.disabled=taxFree; calc(); };
  const syncShares=()=>{ if(!shInp.dataset.edited){
    const base = srcDate || dateInp.value;             // 배당락일을 알면 그 기준, 없으면 입력한 날짜
    const n=sharesForEx(stockId,base); if(n>0) shInp.value=n; } calc(); };
  shInp.addEventListener('input',()=>{ shInp.dataset.edited='1'; calc(); });
  perInp.addEventListener('input',calc); taxInp.addEventListener('input',calc); dateInp.addEventListener('change',syncShares);
  if(netInp) netInp.addEventListener('input',calc);
  function calc(){ const per=parseFloat(perInp.value)||0, sh=parseFloat(shInp.value)||0; const prev=$('#v-prev');
    if(per>0&&sh>0){ let g=curRound(per*sh,s.currency); let rate= taxFree?0:((taxInp.value!==''&&!isNaN(parseFloat(taxInp.value)))?parseFloat(taxInp.value)/100:taxDefault(s.currency));
      // 저장값(divNetCalc)과 똑같은 순서로 — 세전 절사 → 세금 절사 → 빼기. 세후를 한 번에 끊으면 1센트 어긋난다.
      const tax=curRound(g*rate,s.currency), net=curRound(g-tax,s.currency);
      let fx=s.currency==='USD'?(fxNow||0):1; prev.classList.add('on');
      const nv=(netInp&&netInp.value!==''&&!isNaN(parseFloat(netInp.value)))?parseFloat(netInp.value):null;
      let shown = nv!=null? nv : net; const adj = nv!=null? (nv-net) : 0;
      if(nv==null) shown=curRound(shown,s.currency);   // 직접 입력값은 그대로
      prev.innerHTML=`세전 ${fmtCur(g,s.currency)} <span style="opacity:.72">− 세금 ${fmtCur(g-shown,s.currency)}</span> → 세후 <b>${fmtCur(shown,s.currency)}</b>${(s.currency==='USD'&&fx>0)?` ≈ ${fmtKRW(shown*fx)} <span style="opacity:.6">(오늘 환율)</span>`:''} <span style="opacity:.7">(${taxFree?'비과세':'세율 '+(rate*100).toFixed(1)+'%'})</span>`
        + (nv!=null?`<div style="margin-top:6px;font-size:11.5px">자동계산 ${fmtCur(net,s.currency)} → 최종 <b>${fmtCur(nv,s.currency)}</b> · 단수조정 <b style="color:${adj>=0?'var(--green)':'var(--red)'}">${adj>0?'+':''}${fmtCur(adj,s.currency)}</b></div>`:'');
    } else prev.classList.remove('on'); }
  if(!editing) syncShares(); else calc();
  $('#v-save').onclick=()=>{ const per=parseFloat(perInp.value), sh=parseFloat(shInp.value), date=dateInp.value;
    if(!(per>0)) return toast('주당 배당금을 확인하세요'); if(!(sh>0)) return toast('수량을 확인하세요'); if(!date) return toast('지급일을 선택하세요');
    let fx=1; if(s.currency==='USD'){ fx=payFx||fxNow||(editing&&fxV(editing))||1; }
    const taxPct = taxFree? null : (taxInp.value!==''&&!isNaN(parseFloat(taxInp.value))? parseFloat(taxInp.value): null);
    let netFinal = (netInp && netInp.value!=='' && !isNaN(parseFloat(netInp.value))) ? parseFloat(netInp.value) : null;
    // 확정 = 그 시점 실수령액을 고정한다는 뜻. 비어 있으면 지금 계산값을 박아둔다.
    if(locked && (netFinal==null || netFinal==='')) netFinal = divNetCalc({perShare:per,shares:sh,taxPct,taxFree}, s.currency);
    if(editing){ Object.assign(editing,{date,perShare:per,shares:sh,fx,taxPct,taxFree,locked,srcDate,netFinal}); save(); render(); toast(locked?'배당 확정됨 🔒':(editing.locked?'확정 해제됨 🔓':'배당 수정됨')); if(returnToDetail) _sheetReturn=_back; close(); }
    else{ db.divs.push({ id:uid(), stockId, date, perShare:per, shares:sh, fx, taxPct, taxFree, locked, netFinal }); save(); render(); toast(locked?'배당 확정됨 🔒':'배당 기록됨 🌾'); if(returnToDetail) _sheetReturn=_back; close(); } };
  if(editing){ const db_=$('#v-del'); if(db_) db_.onclick=()=>{ if(confirm('이 배당을 삭제할까요?')){ db.divs=db.divs.filter(x=>x.id!==editing.id); save(); render(); toast('삭제됨'); if(returnToDetail) _sheetReturn=_back; close(); } }; }
}

/* ---------- auto dividends ---------- */
async function autoDividends(stockId){
  const s=stById(stockId); const bs=buysOf(stockId);
  if(!bs.length) return toast('먼저 매수 내역이 있어야 해요');
  if(!backendBase()) return toast('백엔드 주소를 설정하세요');
  if(!confirm(`'${s.name}'의 공개 배당이력을 불러올까요?\n· 확정(🔒) 안 된 항목은 최신값으로 갱신\n· 확정한 항목은 그대로 보존\n· 새 배당은 추가 (실입금액과 다를 수 있어 수정 가능)`)) return;
  toast('배당이력 불러오는 중…');
  const res=await apiGet('/dividends?ticker='+encodeURIComponent(s.ticker)+'&market='+encodeURIComponent(s.market||'')+'&years=3');
  if(!res){ return toast('불러오기 실패 (서버 확인)'); }
  if(res.error){ return toast(res.hint||res.error); }
  const list=(res.dividends||[]);
  if(!list.length) return toast('배당이력이 없어요 (미국 종목 위주 지원)');
  const firstBuy=bs[0].date;
  // 원본 지급일(srcDate) 기준 인덱스. srcDate가 없는 옛 기록은 date를 원본으로 간주.
  // → 사용자가 실입금일로 날짜를 바꿔도 같은 항목으로 인식해 중복이 생기지 않는다.
  const existing = divsOf(stockId);
  const byDate={}; existing.forEach(d=>{ byDate[d.srcDate||d.date]=d; });
  const feed=list.filter(d=>d.date>firstBuy && sharesForEx(stockId,d.date)>0);
  if(!feed.length) return toast('보유기간에 해당하는 배당이 없어요');
  // 배당 환차 계산을 위해 지급일 환율을 자동 조회(키인 없음). 실패 시 오늘 환율로 폴백.
  let added=0, updated=0, kept=0, shfix=0;
  const payFxs = s.currency==='USD' ? await Promise.all(feed.map(d=>fetchFx(d.date))) : feed.map(()=>1);
  const fallbackFx = s.currency==='USD' ? (fxNow||1350) : 1;
  const claimed=new Set(Object.values(byDate).map(d=>d.id));
  // 레거시 흡수: srcDate가 없는 옛 기록을 락일에 연결한다.
  // 지급일은 항상 락일보다 뒤이고 보통 2~6주 걸린다 → '그 지급일 직전의 가장 가까운 락일'에 귀속.
  // 예전엔 ±12일만 봐서 RA(락 3.14 → 지급 3.28, 14일)가 안 잡히고 중복이 생겼다.
  const adoptMap={};
  existing.forEach(d=>{ if(claimed.has(d.id)||d.srcDate) return;
    let best=null, bestGap=1e18;
    feed.forEach(f=>{ if(f.date>d.date) return;                 // 락일이 지급일보다 뒤면 제외
      const gap=(new Date(d.date+'T00:00:00')-new Date(f.date+'T00:00:00'))/86400000;
      if(gap<=45 && gap<bestGap){ best=f.date; bestGap=gap; } });
    if(best && !adoptMap[best]) adoptMap[best]=d; });
  const adopt=(iso)=>adoptMap[iso]||null;
  let adopted=0;
  feed.forEach((d,i)=>{
    let ex=byDate[d.date];
    if(!ex){ ex=adopt(d.date); if(ex){ ex.srcDate=d.date; claimed.add(ex.id); adopted++; } }
    const sh=sharesForEx(stockId,d.date);            // 배당락일 전날 기준
    const payFx = (payFxs[i]&&payFxs[i]>0) ? payFxs[i] : fallbackFx;
    if(ex){
      ex.srcDate = d.date;                             // 원본 지급일 고정
      // 확정 항목은 주당배당·날짜·환율을 보존한다. 다만 보유주수는 내 매수 기록이 진실이므로
      // 나중에 추매를 입력하면 소급해서 맞춰준다(금액을 직접 넣어둔 경우엔 그 금액이 그대로 우선).
      if(ex.locked){ kept++;
        if(Math.abs(sh-ex.shares)>1e-9 && sh>0){ ex.shares=sh; shfix++; }
        return; }
      // 사용자가 실입금일로 바꿔둔 날짜는 유지하고, 금액·수량·환율만 갱신
      ex.perShare=d.perShare; ex.shares=sh; if(s.currency==='USD') ex.fx=payFx; updated++;
    } else {
      db.divs.push({id:uid(),stockId,date:d.date,srcDate:d.date,perShare:d.perShare,shares:sh,fx:payFx,taxPct:null,taxFree:false,locked:false}); added++;
    }
  });
  if(adopted) save();
  if(!added && !updated && !shfix){ save(); return toast(`변경 없음 (확정 ${kept}건 보존)`); }
  save(); render();
  toast(`추가 ${added} · 갱신 ${updated}${shfix?` · 확정 주수보정 ${shfix}`:''}${kept?` · 확정보존 ${kept}`:''} 🌾`);
  const _y=sheetScrollY(); openStockDetail(stockId); restoreSheetScroll(_y);
}

/* ---------- 과거 종가·환율 (연도별 평가손익용) ---------- */
let closeCache=(()=>{ try{ return JSON.parse(localStorage.getItem('tmt.closes'))||{}; }catch(e){ return {}; } })();
let fxDayCache=(()=>{ try{ return JSON.parse(localStorage.getItem('tmt.fxday'))||{}; }catch(e){ return {}; } })();
const saveCloses=()=>{ try{ localStorage.setItem('tmt.closes',JSON.stringify(closeCache));
                             localStorage.setItem('tmt.fxday',JSON.stringify(fxDayCache)); }catch(e){} };
function closeOf(s,date){ const m=closeCache[s.ticker]; return (m && m[date]!=null)?+m[date]:null; }
function fxOf(date){ return fxDayCache[date]!=null ? +fxDayCache[date] : null; }
// 기간 경계일의 종가·환율을 한 번에 받아 캐시한다. 과거 값은 안 바뀌므로 영구 보관.
async function fetchMarks(dates){
  if(!backendBase() || !dates.length) return false;
  const need=[...new Set(dates)].filter(d=>d && d<todayISO());
  const missTk=db.stocks.filter(s=>need.some(d=>closeOf(s,d)==null));
  const missFx=need.filter(d=>fxOf(d)==null);
  let got=false;
  if(missTk.length){
    const items=missTk.map(s=>`${s.ticker}:${s.market||(s.currency==='USD'?'US':'KRX')}`).join(',');
    const r=await apiGet('/closes?items='+encodeURIComponent(items)+'&dates='+encodeURIComponent(need.join(',')));
    if(r && r.closes){ Object.entries(r.closes).forEach(([tk,m])=>{
      closeCache[tk]=Object.assign(closeCache[tk]||{}, m); }); got=true; }
  }
  for(const d of missFx){
    const v=await fetchFx(d); if(v>0){ fxDayCache[d]=v; got=true; }
  }
  if(got) saveCloses();
  return got;
}

// 기간 손익 분해 — 실현·배당·평가·환차. from은 배타(그 다음날부터), to는 포함.
// 전체 기간이면 from=null. 배당은 오늘 환율로 환산한다(달러로 계좌에 남아 있으므로).
function periodPnL(from, to){
  // 항목마다 원화 금액을 두 조각으로 쪼갠다 — 겹치는 부분이 없으므로 다 더하면 정확히 합계가 된다.
  //   순수(P) = 외화손익 × 오늘환율   (환율이 안 움직였다면 얼마였을까)
  //   환차(F) = 실제 원화금액 − 순수   (거래시점·매입시점 환율과 오늘 환율의 차이)
  const R={realN:0, divN:0, unrN:0, realK:0, divK:0, unrK:0, baseK:0, pureK:0,
           realPK:0, divPK:0, unrPK:0, realFK:0, divFK:0, unrFK:0,
           cur:{USD:blankCur(), KRW:blankCur()}, incomplete:false};
  const F=todayFx();
  stocksIn().forEach(s=>{
    const isU=s.currency==='USD', C=R.cur[isU?'USD':'KRW'];
    const fxAt=x=>isU?fxV(x):1;
    const shA=from?sharesAsOf(s.id,from):0;
    const shB=sharesAsOf(s.id,to);
    const pxB = (to>=todayISO()) ? ((priceCache[s.id]&&priceCache[s.id].price)||null) : closeOf(s,to);
    const pxA = from? closeOf(s,from) : 0;
    const fxB = isU ? ((to>=todayISO()) ? F : (fxOf(to)||F)) : 1;   // 원화 종목은 항상 1
    const fxA = from? (isU?(fxOf(from)||F):1) : 0;
    if(pxB==null || (from && shA>0 && pxA==null)) R.incomplete=true;
    // 기간 내 거래·배당
    let buyN=0,buyK=0,sellN=0,sellK=0,realN=0,realK=0,divN=0;
    let cost=0, sh=0;                                   // 평단 추적 (기간 이전 포함)
    const evs=[...buysOf(s.id).map(b=>({t:'b',d:b.date,q:b.shares,p:b.price,fx:fxAt(b)})),
               ...sellsOf(s.id).map(x=>({t:'s',d:x.date,q:x.shares,p:x.price,fx:fxAt(x)}))]
              .sort((a,b)=>a.d.localeCompare(b.d));
    evs.forEach(e=>{
      const inP = e.d<=to && (!from || e.d>from);
      if(e.t==='b'){ if(inP){ buyN+=e.q*e.p; buyK+=e.q*e.p*e.fx; }
        cost=(sh*cost+e.q*e.p)/((sh+e.q)||1); sh+=e.q; }
      else { const avg=cost;
        if(inP){ sellN+=e.q*e.p; sellK+=e.q*e.p*e.fx;
                 realN+=e.q*(e.p-avg); realK+=e.q*(e.p-avg)*e.fx; }
        sh=Math.max(0,sh-e.q); }
    });
    divsOf(s.id).forEach(d=>{ if(d.date<=to && (!from || d.date>from)) divN+=divNet(d,s.currency); });
    const vB = (pxB!=null)? shB*pxB : 0, vA = from? ((pxA!=null)? shA*pxA : 0) : 0;
    const unrN = (pxB!=null) ? (vB - vA - buyN + sellN - realN) : 0;   // 순수 평가(외화)
    const unrK = (pxB!=null) ? (vB*fxB - vA*fxA - buyK + sellK - realK) : 0;
    const f1 = isU?F:1;                                 // 원화 종목은 환산 계수가 1
    R.realN+=realN; R.divN+=divN; R.unrN+=unrN;
    R.realK+=realK; R.divK+=divN*f1; R.unrK+=unrK;
    R.realPK+=realN*f1; R.realFK+=realK-realN*f1;       // 매도환율 vs 오늘환율
    R.divPK +=divN*f1;                                  // 배당은 이미 오늘환율 → 환차 0
    R.unrPK +=unrN*f1; R.unrFK +=unrK-unrN*f1;          // 매입환율 vs 오늘환율
    R.pureK += (realN+divN+unrN)*f1;                    // 환율 영향을 뺀 순수 손익
    R.baseK += from? (vA*fxA + buyK) : buyK;
    C.costN+=from?vA:0; C.buyN+=buyN; C.sellN+=sellN; C.divN+=divN; C.evalN+=vB;
    C.costK+=from?vA*fxA:0; C.buyK+=buyK; C.sellK+=sellK; C.evalK+=vB*fxB;
    C.realN+=realN; C.realK+=realK; C.unrN+=unrN; C.unrK+=unrK; C.has=true;
  });
  R.totalK = R.realK+R.divK+R.unrK;
  R.fxK = R.totalK - R.pureK;
  [['USD',F],['KRW',1]].forEach(([k,f1])=>{ const c=R.cur[k];
    c.divK=c.divN*f1; c.base=c.costK+c.buyK;                      // 기준 = 기초평가 + 기간 매수원가
    c.totalK=c.realK+c.divK+c.unrK;
    c.pureK=(c.realN+c.divN+c.unrN)*f1; c.fxK=c.totalK-c.pureK;

    c.realFK=c.realK-c.realPK; c.divFK=0; c.unrFK=c.unrK-c.unrPK; });
  return R;
}

let perfRange='all';                       // all | ytd | y1 | 연도(2026 등)
let perfFrom='', perfTo='';                // 직접 지정 기간
let _marksDone=false;                      // 종가·환율은 한 번만 받아온다 (렌더 루프 방지)
const backISO=(n,unit)=>{ const d=new Date(); if(unit==='m') d.setMonth(d.getMonth()-n); else d.setFullYear(d.getFullYear()-n);
  return isoLocal(d); };
function rangeFromTo(){
  const T=todayISO(), y=+T.slice(0,4);
  if(perfRange==='all') return {from:null,to:T,label:'전체 기간'};
  if(perfRange==='ytd') return {from:(y-1)+'-12-31',to:T,label:y+'년'};
  if(perfRange==='mtd'){ const d=new Date(T+'T00:00:00'); d.setDate(0);   // 전월 말일
    return {from:isoLocal(d), to:T, label:T.slice(0,7).replace('-','년 ')+'월'}; }
  if(perfRange==='last') return {from:(y-2)+'-12-31', to:(y-1)+'-12-31', label:(y-1)+'년'};
  if(perfRange==='custom'){ const a=perfFrom||backISO(3,'m'), b=perfTo||T;
    return {from:a, to:b, label:`${a.slice(2).replace(/-/g,'.')} ~ ${b.slice(2).replace(/-/g,'.')}`}; }
  const yy=+perfRange;
  return {from:(yy-1)+'-12-31', to:(yy>=y?T:yy+'-12-31'), label:yy+'년'};
}
function perfYears(){
  const ds=[...db.buys,...db.sells,...db.divs].map(x=>x.date).filter(Boolean).sort();
  if(!ds.length) return [];
  const a=+ds[0].slice(0,4), b=+todayISO().slice(0,4), out=[];
  for(let y=b;y>=a;y--) out.push(y);
  return out;
}
function perfMarkDates(){
  const set=new Set(); const y=+todayISO().slice(0,4);
  perfYears().forEach(yy=>set.add((yy-1)+'-12-31'));
  ['mtd','ytd','last'].forEach(k=>{ const sv=perfRange; perfRange=k;
    const r=rangeFromTo(); if(r.from) set.add(r.from); if(r.to) set.add(r.to); perfRange=sv; });
  return [...set].filter(x=>x<todayISO());
}

function bindPerf(){

/* ---------- 목표 비중 · 이번달 매수 배분 ---------- */
// 목표 비중은 계좌별로 저장한다: db.targets[accountId] = {stockId: pct, ..., _in: 월투입액}
// 매달 살 금액 = (현재총액 + 이번달 투입) × 목표비중 − 현재 평가액  → 부족분 비율대로 나눈다.
// 파는 게 아니라 '모자란 쪽만 채워서' 비중을 맞추는 방식이라 적립식에 그대로 맞는다.
let targetFold=false;
function targetsOf(aid){ if(!db.targets) db.targets={}; if(!db.targets[aid]) db.targets[aid]={}; return db.targets[aid]; }
function targetPlan(aid){
  const t=targetsOf(aid);
  const skip=new Set(t._skip||[]);                       // 매도 예정 — 분모·배분에서 제외
  const sim=t._sim||{};                                  // 시뮬레이션 보유분 {stockId:{sh,px}} — 실제 보유와 무관
  const list=db.stocks.filter(s=>s.accountId===aid);
  const rows=list.map(s=>{ const st=stockStats(s);
    const held = st.shares>0 || buysOf(s.id).length>0;
    const sm = sim[s.id];
    // 실제 보유 종목은 평가금액, 관심 종목은 목표 탭에서 입력한 가상 수량 × 단가
    const val = held ? (st.evalKRW||0)
                     : (sm ? sm.sh*sm.px*(s.currency==='USD'?todayFx():1) : 0);
    return {s, pct:+(t[s.id]||0), val, skip:skip.has(s.id), held, sim:sm||null}; })
    .filter(r=>r.pct>0 || r.val>0 || r.skip || !r.held);  // 관심 종목은 항상 보이게
  const live=rows.filter(r=>!r.skip);
  const sumPct=live.reduce((a,r)=>a+r.pct,0);
  const cur=live.reduce((a,r)=>a+r.val,0);
  const inAmt=+(t._in||0);
  const after=cur+inAmt;
  let need=0;
  live.forEach(r=>{ r.want = sumPct>0 ? after*r.pct/sumPct : 0;
    r.gap = Math.max(0, r.want-r.val); need+=r.gap;
    r.now = cur>0 ? r.val/cur*100 : 0; });
  live.forEach(r=>{ r.buy = (inAmt>0 && need>0) ? inAmt*r.gap/need : 0; });
  // 실제로 배분된 금액만 분모에 더한다. 목표를 안 넣으면 배분이 0이므로 다음달 = 현재.
  const spent=live.reduce((a,r)=>a+r.buy,0);
  const base2=cur+spent;
  live.forEach(r=>{ r.next = base2>0 ? (r.val+r.buy)/base2*100 : 0; });
  rows.filter(r=>r.skip).forEach(r=>{ r.now=0; r.buy=0; r.next=0; });
  rows.sort((a,b)=> (a.skip-b.skip) || (a.held-b.held) || b.buy-a.buy || b.val-a.val);
  return {rows, live, sumPct, cur, inAmt, need, spent,
          sumNow:live.reduce((a,r)=>a+r.now,0), sumNext:live.reduce((a,r)=>a+r.next,0),
          skipVal:rows.filter(r=>r.skip).reduce((a,r)=>a+r.val,0)};
}

      : '목표보다 모자란 종목부터 채워요 · <b>다음달</b>은 이번달 매수를 반영한 예상 비중이에요.'}<br>여기 입력값은 계산에만 쓰이고 보유내역·수익률엔 반영되지 않아요.${P.skipVal>0?`<br>제외 ${fmtK(P.skipVal)}은 분모에서 빠져 있어요.`:''}</div>`}
  </div>`;
}
function bindTarget(){
  const h=$('#tgtHead'); if(h) h.onclick=()=>{ targetFold=!targetFold; render(); };
  const inp=$('#tgt-in');
  if(inp){
    inp.oninput=()=>{ const n=inp.value.replace(/[^0-9]/g,''); inp.value = n? (+n).toLocaleString('ko-KR') : ''; };
    inp.onchange=()=>{ targetsOf(filterAcct)._in=Math.max(0,+inp.value.replace(/[^0-9]/g,'')||0); save(); render(); };
  }
  const ad=$('#tgt-add'); if(ad) ad.onclick=()=>openStockAdd(true);   // 목표 카드에선 보유에 영향 없는 관심 종목만
  $$('[data-tgoff]').forEach(b=>b.onclick=()=>{
    const t=targetsOf(filterAcct); const id=b.dataset.tgoff;
    t._skip=[...new Set([...(t._skip||[]),id])]; delete t[id]; save(); render(); });
  $$('[data-tgdel]').forEach(b=>b.onclick=()=>{
    const id=b.dataset.tgdel; const st=db.stocks.find(x=>x.id===id);
    if(!confirm(`${st?(st.ticker||st.name):'이 종목'}을 목록에서 삭제할까요?`)) return;
    db.stocks=db.stocks.filter(x=>x.id!==id);
    const t=targetsOf(filterAcct); delete t[id]; t._skip=(t._skip||[]).filter(x=>x!==id);
    if(t._sim) delete t._sim[id];
    save(); render(); toast('삭제됨'); });
  $$('[data-tgon]').forEach(b=>b.onclick=()=>{
    const t=targetsOf(filterAcct); t._skip=(t._skip||[]).filter(x=>x!==b.dataset.tgon); save(); render(); });
  $$('[data-tgt]').forEach(el=>el.onchange=()=>{
    const t=targetsOf(filterAcct); const v=Math.max(0,+el.value||0);
    if(v>0) t[el.dataset.tgt]=v; else delete t[el.dataset.tgt];
    save(); render(); });
}

/* ---------- 주식 병합 · 분할 ---------- */
// ratio = 조정 후 주수 ÷ 조정 전 주수.  5주→1주 병합이면 0.2, 1주→2주 분할이면 2.
// 기준일 이전 기록의 주수는 ×ratio, 단가·주당배당은 ÷ratio → 원금과 수령 총액은 그대로.
// 야후가 주는 조정 주당배당과 같은 기준이 되므로 배당 추이 차트도 어긋나지 않는다.
function openSplit(stockId){
  const s=stById(stockId); if(!s) return;
  const _back=backToDetail(stockId);
  if(scrim.classList.contains('on')) _sheetReturn=_back;
  const past=(db.splits||[]).filter(x=>x.stockId===stockId).sort((a,b)=>b.date.localeCompare(a.date));
  const held=db.buys.filter(b=>b.stockId===stockId).reduce((t,b)=>t+b.shares,0)
            -db.sells.filter(x=>x.stockId===stockId).reduce((t,x)=>t+x.shares,0);
  sheet(`<h2>주식 병합 · 분할</h2>
    <div class="hint">${esc(dispTk(s))} · 현재 ${fmtNumS(held)}주. 기준일 이전 기록을 소급 조정해요. 투자원금과 이미 받은 배당 총액은 변하지 않아요.</div>
    <div class="field"><label>유형</label><div class="seg-in" id="sp-kind">
      <button type="button" data-k="merge" class="on">병합 (주수 감소)</button><button type="button" data-k="split">분할 (주수 증가)</button></div></div>
    <div class="row2">
      <div class="field"><label id="sp-nlbl">몇 주가 1주로</label><input id="sp-n" type="number" inputmode="decimal" step="any" placeholder="5" value="5"></div>
      <div class="field"><label>기준일</label><input id="sp-date" type="date" value="${todayISO()}"></div>
    </div>
    <div class="field"><label>단수주 정산 현금 (선택 · ${s.currency})</label><input id="sp-cash" type="number" inputmode="decimal" step="any" placeholder="예: 6.40">
      <div class="hint" style="margin-top:5px">1주 미만 잔여분을 현금으로 받았다면 총액을 넣어주세요. 매도로 기록돼 실현손익에 반영돼요.</div></div>
    <div class="setcard" id="sp-prev" style="padding:12px 14px;margin-top:4px"></div>
    ${past.length?`<div class="hint" style="margin-top:10px">이미 적용됨 · ${past.map(x=>`${x.date} ${esc(x.memo)}`).join(' · ')}</div>`:''}
    <div class="sheet-actions"><button class="btn ghost" id="sp-cancel">취소</button><button class="btn" id="sp-save">적용</button></div>`);
  let kind='merge';
  const nInp=$('#sp-n'), dInp=$('#sp-date'), cashInp=$('#sp-cash'), prev=$('#sp-prev');
  const ratioOf=()=>{ const n=parseFloat(nInp.value); return (n>0)? (kind==='merge'?1/n:n) : null; };
  const affected=()=>{ const d=dInp.value||todayISO();
    return { b:db.buys.filter(x=>x.stockId===stockId&&x.date<d),
             x:db.sells.filter(x=>x.stockId===stockId&&x.date<d),
             v:db.divs.filter(x=>x.stockId===stockId&&x.date<d) }; };
  const paint=()=>{
    $('#sp-nlbl').textContent = kind==='merge' ? '몇 주가 1주로' : '1주가 몇 주로';
    const r=ratioOf(), a=affected();
    if(!r){ prev.innerHTML='<div class="hint">비율을 입력하세요.</div>'; return; }
    const bS=a.b.reduce((t,x)=>t+x.shares,0), xS=a.x.reduce((t,x)=>t+x.shares,0);
    const after=(bS-xS)*r, costN=a.b.reduce((t,x)=>t+x.shares*x.price,0);
    const frac=after-Math.floor(after+1e-9);
    prev.innerHTML=`<div style="font-size:12px;font-weight:700;line-height:1.85">
      대상 기록 <b>매수 ${a.b.length} · 매도 ${a.x.length} · 배당 ${a.v.length}</b>건<br>
      보유주수 <b>${fmtNumS(bS-xS)}주 → ${fmtNumS(after)}주</b>${frac>1e-6?` <span style="color:var(--red)">· 단수주 ${fmtNumS(frac)}주</span>`:''}<br>
      평균단가 <b>${fmtCur(costN/(bS||1),s.currency)} → ${fmtCur(costN/((bS*r)||1),s.currency)}</b><br>
      <span style="color:var(--muted)">투자원금 ${fmtCur(costN,s.currency)} · 변동 없음</span></div>`; };
  $('#sp-kind').querySelectorAll('button').forEach(b=>b.onclick=()=>{ kind=b.dataset.k;
    $('#sp-kind').querySelectorAll('button').forEach(y=>y.classList.toggle('on',y===b)); paint(); });
  [nInp,dInp].forEach(el=>el.addEventListener('input',paint));
  paint();
  $('#sp-cancel').onclick=()=>{ _sheetReturn=_back; close(); };
  $('#sp-save').onclick=()=>{
    const r=ratioOf(), d=dInp.value;
    if(!r) return toast('비율을 확인하세요');
    if(!d) return toast('기준일을 선택하세요');
    if(Math.abs(r-1)<1e-9) return toast('비율이 1이면 바뀌는 게 없어요');
    const a=affected();
    if(!a.b.length && !a.x.length && !a.v.length) return toast('기준일 이전 기록이 없어요');
    const adj=x=>{ x.shares=x.shares*r; if(x.price!=null) x.price=x.price/r; if(x.perShare!=null) x.perShare=x.perShare/r; x.splitAdj=(x.splitAdj||1)*r; };
    a.b.forEach(adj); a.x.forEach(adj); a.v.forEach(adj);
    const after=db.buys.filter(y=>y.stockId===stockId).reduce((t,y)=>t+y.shares,0)
               -db.sells.filter(y=>y.stockId===stockId).reduce((t,y)=>t+y.shares,0);
    const frac=after-Math.floor(after+1e-9);
    const cash=parseFloat(cashInp.value);
    if(frac>1e-6 && cash>0)
      db.sells.push({id:uid(),stockId,date:d,shares:frac,price:cash/frac,fx:fxNow||null,memo:'단수주 현금정산',noflow:true});
    db.splits.push({id:uid(),stockId,date:d,ratio:r,memo:(kind==='merge'?`${fmtNumS(1/r)}대1 병합`:`1대${fmtNumS(r)} 분할`)});
    save(); render();
    toast(kind==='merge'?'병합 반영됨 🔀':'분할 반영됨 🔀');
    _sheetReturn=_back; close();
  };
}

/* ---------- account ---------- */
const FLOW_CURS=[['KRW','원'],['USD','$'],['JPY','¥'],['HKD','HK$']];
function flowKRW(f){ return Math.abs(f.amount); }                 // 저장은 항상 원화 환산값
// 환전 = 원화 통장 −, 외화 통장 + (또는 그 반대). 두 통장에 한 쌍으로 기록한다.
// 원화액과 달러액을 그대로 넣으면 원화÷달러 = 실제 적용환율이라 증권사 스프레드까지 잡힌다.
function openExch(xfId){
  const pair = xfId ? db.flows.filter(f=>f.xfId===xfId) : [];
  const kOld = pair.find(f=>bookOfFlow(f)==='krw'), fOld = pair.find(f=>bookOfFlow(f)==='fx');
  const editing = !!(kOld && fOld);
  let toUSD = editing ? (kOld.type==='out') : true;          // true = 원화 → 외화
  const acctOpts = db.accounts.map(a=>`<option value="${a.id}"${(editing&&kOld.accountId===a.id)||(!editing&&filterAcct===a.id)?' selected':''}>${esc(a.name)}</option>`).join('');
  const defAcct = filterAcct!=='all'?filterAcct:(db.accounts[0]&&db.accounts[0].id);
  sheet(`<h2>${editing?'환전 수정':'환전 기록'}</h2>
    <div class="hint">원화 통장에서 나간 원화와 외화 통장에 들어온 달러를 한 번에 기록해요. 두 금액을 그대로 넣으면 적용환율(스프레드 포함)이 자동으로 계산됩니다.</div>
    <div class="field"><label>방향</label><div class="seg-in" id="xc-dir">
      <button type="button" data-d="1" class="${toUSD?'on':''}">원화 → 외화</button>
      <button type="button" data-d="0" class="${toUSD?'':'on'}">외화 → 원화</button></div></div>
    <div class="field"><label>날짜</label><input id="xc-date" type="date" value="${editing?kOld.date:todayISO()}"></div>
    <div class="row2">
      <div class="field"><label>원화 (원)</label><input id="xc-krw" type="number" inputmode="decimal" step="any" placeholder="0" value="${editing?Math.round(Math.abs(kOld.amount)):''}"></div>
      <div class="field"><label>외화 (USD)</label><input id="xc-usd" type="number" inputmode="decimal" step="any" placeholder="0" value="${editing?fOld.amtNative:''}"></div></div>
    <div class="hint" id="xc-rate" style="margin-top:-4px">두 칸을 채우면 적용환율이 나와요.</div>
    <div class="field"><label>계좌</label><select id="xc-acct">${acctOpts}</select></div>
    <div class="field"><label>메모 (선택)</label><input id="xc-memo" placeholder="예: 매수용 환전" value="${editing?esc((kOld.memo||'').replace(/^환전.*?· ?/,'')):''}"></div>
    <div class="sheet-actions">${editing?`<button class="btn ghost" id="xc-del" style="color:var(--red)">삭제</button>`:''}<button class="btn" id="xc-save">${editing?'저장':'추가'}</button></div>`);
  const kInp=$('#xc-krw'), uInp=$('#xc-usd'), note=$('#xc-rate');
  const paint=()=>{ const k=parseFloat(kInp.value), u=parseFloat(uInp.value);
    note.innerHTML = (k>0&&u>0) ? `적용환율 <b>${(k/u).toFixed(2)}원</b> / $1 · 오늘 ${Math.round(todayFx()).toLocaleString('ko-KR')}원`
                                : '두 칸을 채우면 적용환율이 나와요.'; };
  [kInp,uInp].forEach(x=>x.addEventListener('input',paint)); paint();
  const dir=$('#xc-dir'); dir.querySelectorAll('button').forEach(b=>b.onclick=()=>{ toUSD=b.dataset.d==='1';
    dir.querySelectorAll('button').forEach(x=>x.classList.toggle('on',(x.dataset.d==='1')===toUSD)); });
  $('#xc-save').onclick=()=>{
    const krw=Math.abs(parseFloat(kInp.value)), usd=Math.abs(parseFloat(uInp.value)), date=$('#xc-date').value;
    if(!(krw>0)||!(usd>0)) return toast('원화·외화 금액을 모두 넣어주세요');
    if(!date) return toast('날짜를 선택하세요');
    const rate=krw/usd, memo=$('#xc-memo').value.trim();
    const acct=($('#xc-acct')&&$('#xc-acct').value)||defAcct;
    const kMemo=`환전 ${toUSD?'→':'←'} ${fmtCur(usd,'USD')}`+(memo?` · ${memo}`:'');
    const fMemo=`환전 ${toUSD?'←':'→'} ${fmtKRW(Math.round(krw))}`+(memo?` · ${memo}`:'');
    const kNew={accountId:acct,date,type:toUSD?'out':'in',amount:Math.round(krw),amtNative:Math.round(krw),cur:'KRW',fx:1,memo:kMemo,auto:false,book:'krw'};
    const fNew={accountId:acct,date,type:toUSD?'in':'out',amount:Math.round(krw),amtNative:usd,cur:'USD',fx:rate,memo:fMemo,auto:false,book:'fx'};
    if(editing){ Object.assign(kOld,kNew,{edited:true}); Object.assign(fOld,fNew,{edited:true}); }
    else { const xf=uid(); db.flows.push({id:uid(),xfId:xf,...kNew},{id:uid(),xfId:xf,...fNew}); }
    save(); _sheetReturn=null; close(); render(); toast(editing?'수정됨':'환전 기록됨'); };
  if(editing){ const del=$('#xc-del'); if(del) del.onclick=()=>{ if(confirm('이 환전 기록을 삭제할까요? 원화·외화 양쪽에서 함께 지워집니다.')){
    db.flows=db.flows.filter(f=>f.xfId!==xfId); save(); _sheetReturn=null; close(); render(); toast('삭제됨'); } }; }
}
function openFlow(id, type, book){

    ${!linked?`<div class="field"><label>구분</label><div class="seg-in" id="fl-type"><button type="button" data-t="in" class="${t==='in'?'on':''}">＋ 입금</button><button type="button" data-t="out" class="${t==='out'?'on':''}">− 출금</button></div></div>`:''}

  let curT=t;
  // 통화 전환 — 라벨·환율칸을 같이 바꾸고, USD는 날짜에 맞는 환율을 자동으로 채운다

    const amt = Math.round(nat*fx);                       // 원화 환산 — 순투입·집계는 이 값을 쓴다
    const memo=$('#fl-memo').value.trim();
    if(editing){ Object.assign(editing,{amount:amt,amtNative:nat,cur:curC,fx,date,memo,edited:true}); if(!linked){ editing.type=curT; const a=$('#fl-acct'); if(a)editing.accountId=a.value; } }
    else { const acct=($('#fl-acct')&&$('#fl-acct').value)||defAcct; db.flows.push({id:uid(),accountId:acct,date,type:curT,amount:amt,amtNative:nat,cur:curC,fx,memo,auto:false,book:bk}); }
    save(); _sheetReturn=null; close(); render(); toast(editing?'수정됨':'기록됨'); };
  if(editing){ const del=$('#fl-del'); if(del) del.onclick=()=>{ if(confirm(linked?'이 자동 입금/출금을 순투입에서 뺄까요? (배당으로 재투자한 매수라면 빼는 게 맞아요. 매수 기록 자체는 유지됩니다)':'이 입출금 기록을 삭제할까요?')){
    if(editing.buyId){ const b=db.buys.find(x=>x.id===editing.buyId); if(b) b.noflow=true; }
    if(editing.sellId){ const x=db.sells.find(y=>y.id===editing.sellId); if(x) x.noflow=true; }
    db.flows=db.flows.filter(f=>f.id!==editing.id); save(); _sheetReturn=null; close(); render(); toast('삭제됨'); } }; }
}
function openAccount(id){
  const a=id?acctById(id):null;
  const colorDots=ACCT_COLORS.map(c=>`<button type="button" class="acolor" data-c="${c}" style="width:34px;height:34px;border-radius:50%;background:${c};border:3px solid ${a&&a.color===c?'var(--ink)':'transparent'}"></button>`).join('');
  sheet(`<h2>${a?'계좌 수정':'계좌 추가'}</h2><div class="hint">증권사·용도별로 계좌를 구분해요.</div>
    <div class="field"><label>계좌 이름</label><input id="a-name" placeholder="예: 토스증권 (배당)" value="${a?esc(a.name):''}"></div>
    <div class="field"><label>증권사 (선택)</label><input id="a-broker" placeholder="예: 토스증권" value="${a?esc(a.broker||''):''}"></div>
    <div class="field"><label>색상</label><div style="display:flex;gap:10px;flex-wrap:wrap" id="a-colors">${colorDots}</div></div>
    <div class="field"><label>숫자 표시</label><label style="display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:var(--ink2)"><input type="checkbox" id="a-trunc" style="width:18px;height:18px"${a&&a.trunc?' checked':''}> 평단·수익률 버림 (토스 방식)</label><div class="hint" style="margin-top:5px">반올림 대신 잘라냅니다. 예) 56.5467 → 56.54, 10.278% → 10.2%</div></div>
    <div class="sheet-actions">${a&&db.accounts.length>1?'<button class="btn ghost" id="a-del">삭제</button>':''}<button class="btn" id="a-save">${a?'저장':'추가'}</button></div>`);
  let color=a?a.color:ACCT_COLORS[db.accounts.length%ACCT_COLORS.length];
  $('#a-colors').querySelectorAll('.acolor').forEach(b=>b.onclick=()=>{ color=b.dataset.c; $('#a-colors').querySelectorAll('.acolor').forEach(x=>x.style.border='3px solid transparent'); b.style.border='3px solid var(--ink)'; });
  $('#a-save').onclick=()=>{ const name=$('#a-name').value.trim(); if(!name) return toast('계좌 이름을 입력하세요'); const broker=$('#a-broker').value.trim();
    const trunc=!!($('#a-trunc')&&$('#a-trunc').checked);
    if(a){ Object.assign(a,{name,broker,color,trunc}); } else { db.accounts.push({id:uid(),name,broker,color,trunc}); } save(); _sheetReturn=null; close(); render(); toast(a?'저장됨':'계좌 추가됨'); };
  if(a&&db.accounts.length>1)$('#a-del').onclick=()=>{ const n=db.stocks.filter(s=>s.accountId===a.id).length;
    if(!confirm(`'${a.name}' 계좌를 삭제할까요?${n?`\n종목 ${n}개도 함께 삭제됩니다.`:''}`)) return;
    const sids=db.stocks.filter(s=>s.accountId===a.id).map(s=>s.id);
    db.stocks=db.stocks.filter(s=>s.accountId!==a.id); db.buys=db.buys.filter(b=>!sids.includes(b.stockId)); db.sells=db.sells.filter(b=>!sids.includes(b.stockId)); db.divs=db.divs.filter(d=>!sids.includes(d.stockId));
    db.accounts=db.accounts.filter(x=>x.id!==a.id); if(filterAcct===a.id)filterAcct='all'; save(); _sheetReturn=null; close(); render(); toast('삭제됨'); };
}

/* ---------- data io ---------- */
function exportData(){ const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='tmt-asset-backup-'+todayISO()+'.json'; a.click(); db.lastAutoBackup=Date.now(); save(); toast('백업 저장됨'); }
function importData(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.json,application/json';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return; const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d.accounts&&!d.stocks) throw 0; db=Object.assign({accounts:[],stocks:[],buys:[],sells:[],divs:[],taxUS:15,taxKR:15.4,theme:'light',apiBase:'',seeded:false,lastAutoBackup:0,autoBackupOn:true},d); if(!db.sells)db.sells=[]; if(!db.accounts.length)db.accounts.push({id:uid(),name:'토스증권 (배당)',broker:'토스증권',color:ACCT_COLORS[0]}); save(); applyTheme(); render(); toast('불러오기 완료'); }catch(e){ toast('파일 형식 오류'); } };
    r.readAsText(f); };
  inp.click(); }
function resetAll(){ if(confirm('정말 모든 데이터를 삭제할까요? 되돌릴 수 없어요.')){ db={accounts:[{id:uid(),name:'토스증권 (배당)',broker:'토스증권',color:ACCT_COLORS[0]}],stocks:[],buys:[],sells:[],divs:[],taxUS:db.taxUS,taxKR:db.taxKR,theme:db.theme,apiBase:db.apiBase,seeded:false,lastAutoBackup:db.lastAutoBackup||0,autoBackupOn:db.autoBackupOn!==false}; filterAcct='all'; priceCache={}; save(); render(); toast('초기화됨'); } }

/* ---------- backup (phone file) ---------- */
function backupFilename(tag){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `tmt-backup-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${tag?'-'+tag:''}.json`; }
function downloadBackup(fname){ try{ const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1200); return true; }catch(e){ return false; } }
function phoneBackup(){ if(downloadBackup(backupFilename(''))){ db.lastAutoBackup=Date.now(); save(); if(tab==='settings') render(); toast('📲 폰에 백업됨 (파일 저장)'); } else toast('백업 실패'); }
/* 하루 2회(12시간마다) 자동 백업 — 브라우저 정책상 다운로드는 사용자 탭 제스처에서 실행되므로,
   앱을 열고 처음 화면을 터치할 때 조건 충족 시 자동 저장한다. */
let _autoPending=false;
function checkAutoBackup(){
  if(!db.autoBackupOn) return;
  if(!(db.stocks.length||db.divs.length)) return;
  const HALF=12*3600*1000;
  if(Date.now()-(db.lastAutoBackup||0) >= HALF) _autoPending=true;
}
function runAutoBackupIfPending(){
  if(!_autoPending) return;
  if(downloadBackup(backupFilename('auto'))){ _autoPending=false; db.lastAutoBackup=Date.now(); save(); toast('🗂 자동 백업 저장됨'); if(tab==='settings') render(); }
}
document.addEventListener('pointerdown',runAutoBackupIfPending);

/* ---------- seed ---------- */
function seed(){
  const ac=db.accounts[0].id;
  const s1={id:uid(),accountId:ac,name:'리얼티 인컴',ticker:'O',market:'NYSE',currency:'USD'};
  const s2={id:uid(),accountId:ac,name:'맥쿼리인프라',ticker:'088980',market:'KOSPI',currency:'KRW'};
  db.stocks.push(s1,s2);
  db.buys.push({id:uid(),stockId:s1.id,date:'2025-01-10',shares:60,price:57.2,fx:1450},{id:uid(),stockId:s1.id,date:'2025-06-15',shares:60,price:55.6,fx:1370},{id:uid(),stockId:s2.id,date:'2025-02-01',shares:300,price:12100,fx:1});
  for(let m=0;m<7;m++) db.divs.push({id:uid(),stockId:s1.id,date:`2026-0${m+1}-15`,perShare:0.263,shares:120,fx:1360,taxPct:null,taxFree:false});
  db.divs.push({id:uid(),stockId:s2.id,date:'2026-02-20',perShare:390,shares:300,fx:1,taxPct:null,taxFree:false});
  db.seeded=true; save(); loadLive(true); render(); toast('예시 데이터를 넣었어요');
}
function clearSeed(){ if(!confirm('예시 데이터를 모두 지우고 실제 입력을 시작할까요?')) return; db.stocks=[]; db.buys=[]; db.sells=[]; db.divs=[]; db.seeded=false; priceCache={}; save(); render(); toast('예시를 지웠어요'); }

/* ---------- FAB ---------- */
function openAdd(){
  sheet(`<h2>무엇을 추가할까요?</h2><div class="hint">종목을 새로 담거나, 기존 종목에 거래/배당을 기록해요.</div>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:4px">
      <button class="btn" id="a-stock" style="width:100%;padding:15px">＋  종목 추가 (검색)</button>
      ${db.stocks.length?`<button class="btn ghost" id="a-tx" style="width:100%;padding:15px">📝  기존 종목에 매수·매도·배당</button>`:''}
    </div>`);
  $('#a-stock').onclick=()=>openStockAdd();
  const at=$('#a-tx'); if(at)at.onclick=()=>pickStockThen();
}
function pickStockThen(){
  const opts=db.stocks.map(s=>`<option value="${s.id}">${esc(s.name)} (${s.currency})</option>`).join('');
  sheet(`<h2>종목 선택</h2><div class="hint">기록할 종목을 고르세요.</div>
    <div class="field"><label>종목</label><select id="p-stock">${opts}</select></div>
    <div class="sheet-actions"><button class="btn ghost" id="p-buy">매수</button><button class="btn ghost" id="p-sell">매도</button><button class="btn" id="p-div">배당</button></div>`);
  $('#p-buy').onclick=()=>{ const id=$('#p-stock').value; openBuy(id); };
  $('#p-sell').onclick=()=>{ const id=$('#p-stock').value; openSell(id); };
  $('#p-div').onclick=()=>{ const id=$('#p-stock').value; openDiv(id); };
}

/* ---------- global ---------- */
document.addEventListener('click', function(e){
  const f=e.target && e.target.closest && e.target.closest('#fab');
  if(f){ e.preventDefault(); _sheetReturn=null; openAdd(); }
}, true);
$$('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
function applyTheme(){ document.documentElement.setAttribute('data-theme',db.theme==='dark'?'dark':''); document.querySelector('meta[name=theme-color]').setAttribute('content',db.theme==='dark'?'#0C1017':'#F4F3EF'); }
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(t._); t._=setTimeout(()=>t.classList.remove('on'),1900); }

applyTheme();
loadUI();
checkAutoBackup();
render();

/* ---------- 안드로이드 뒤로가기 ----------
   우선순위: 열린 시트 닫기 → 이전 탭 → (홈에서 누르면) 앱 종료 */
try{ history.replaceState({tmt:'tab',tab:tab},''); _navTab=tab; }catch(e){}
window.addEventListener('popstate', function(e){
  if(_sheetOpen){ _fromPop=true; close(); _fromPop=false; return; }
  const st=e.state;
  if(st && st.tmt==='tab'){
    if(tab!==_navTab){                 // 외부 탭 모듈이 히스토리 없이 탭을 바꾼 상태 → 그 탭에 그대로 머문다
      _navTab=tab; try{ history.pushState({tmt:'tab',tab:tab},''); }catch(e2){}
      return; }
    if(tab!==st.tab){ tab=st.tab; _navTab=tab; render(); window.scrollTo(0,0); }
    return;
  }
  if(tab!=='dash'){ tab='dash'; _navTab='dash'; render(); window.scrollTo(0,0); try{ history.pushState({tmt:'tab',tab:'dash'},''); }catch(e2){} }
});
apiGet('/warm');            // 앱 열 때 서버 미리 깨우기(첫 검색 빠르게)
loadLive();                // 현재가 미리 로딩
if('serviceWorker' in navigator){
  // 새 버전이 활성화되면 화면을 딱 한 번 자동 새로고침 (수동 캐시삭제·재실행 불필요)
  const _hadController = !!navigator.serviceWorker.controller;
  let _reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(_reloaded) return; _reloaded=true;
    if(_hadController) location.reload();   // 최초 설치가 아니라 '업데이트'일 때만 새로고침
  });
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
